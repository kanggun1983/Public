<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 정밀 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { font-family: sans-serif; background: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 45px; background: #111; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
    
    #main-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    /* 업로드 영역 */
    #upload-box { width: 80%; height: 200px; border: 2px dashed #666; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
    
    /* 편집기 캔버스 */
    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* 컨트롤러 영역 */
    #controls { height: 240px; background: #1a1a1a; padding: 10px; display: none; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 5px; }
    .corner-btn { flex: 1; height: 35px; background: #333; border: none; color: #fff; border-radius: 5px; font-size: 12px; }
    .corner-btn.active { background: #00e676; color: #000; }
    
    .dpad-area { display: flex; align-items: center; justify-content: space-around; }
    .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; gap: 5px; }
    .dpad button { background: #444; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; }
    
    .btn-action { height: 50px; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>

<header>신분증 정밀 스캐너</header>

<input type="file" id="album-input" accept="image/*" style="display: none;">

<div id="main-container">
    <div id="upload-box" onclick="document.getElementById('album-input').click()">
        <div style="font-size: 50px;">🖼️</div>
        <div>갤러리에서 사진 불러오기</div>
    </div>
    <div id="editor-view">
        <canvas id="editor-canvas"></canvas>
    </div>
</div>

<div id="controls">
    <div class="row">
        <button class="corner-btn" onclick="selectCorner(0)">┌ 좌상</button>
        <button class="corner-btn" onclick="selectCorner(1)">┐ 우상</button>
        <button class="corner-btn" onclick="selectCorner(2)">┘ 우하</button>
        <button class="corner-btn" onclick="selectCorner(3)">└ 좌하</button>
    </div>
    <div class="dpad-area">
        <div class="dpad">
            <div></div><button onpointerdown="nudge(0,-5)">▲</button><div></div>
            <button onpointerdown="nudge(-5,0)">◀</button><button onpointerdown="nudge(0,5)">▼</button><button onpointerdown="nudge(5,0)">▶</button>
        </div>
        <div style="display:flex; flex-direction:column; gap:5px; flex:1;">
            <button class="btn-action" style="background:#9c27b0; color:#fff;" onclick="printA4()">🖨️ 인쇄</button>
            <button class="btn-action" style="background:#00e676; color:#000;" onclick="saveA4()">💾 저장(JPG)</button>
        </div>
    </div>
</div>

<script>
    let cvReady = false, originalImg = null, points = [], activeIdx = 0;
    function onOpenCvReady() { cvReady = true; }

    document.getElementById('album-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            originalImg = new Image();
            originalImg.onload = () => {
                document.getElementById('upload-box').style.display = 'none';
                document.getElementById('editor-view').style.display = 'flex';
                document.getElementById('controls').style.display = 'flex';
                initCanvas();
            };
            originalImg.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    function initCanvas() {
        const canvas = document.getElementById('editor-canvas');
        const scale = Math.min(window.innerWidth/originalImg.width, (window.innerHeight*0.5)/originalImg.height);
        canvas.width = originalImg.width * scale; canvas.height = originalImg.height * scale;
        const s = canvas.width*0.2;
        points = [{x:s,y:s}, {x:canvas.width-s, y:s}, {x:canvas.width-s, y:canvas.height-s}, {x:s, y:canvas.height-s}];
        render();
    }

    function render() {
        const canvas = document.getElementById('editor-canvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#00e676'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
        points.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath(); ctx.stroke();
        points.forEach((p, i) => {
            ctx.fillStyle = (i === activeIdx) ? '#ffea00' : '#ff1744';
            ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
        });
    }

    // 좌표계산 수정 (CSS 픽셀 vs 캔버스 실제 픽셀 매핑)
    canvas.addEventListener('pointermove', (e) => {
        if(e.buttons !== 1) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        points[activeIdx] = {x, y};
        render();
    });

    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        points.forEach((p, i) => { if(Math.hypot(p.x-x, p.y-y) < 50) activeIdx = i; });
        render();
    });

    function selectCorner(idx) { activeIdx = idx; render(); }
    function nudge(dx, dy) { points[activeIdx].x += dx; points[activeIdx].y += dy; render(); }

    function getCleanCard() {
        const dstW = 1011, dstH = 638;
        const canvas = document.createElement('canvas'); canvas.width = dstW; canvas.height = dstH;
        const ctx = canvas.getContext('2d');
        // Perspective warp logic simplified
        ctx.drawImage(originalImg, 0, 0, dstW, dstH);
        
        const out = document.createElement('canvas'); out.width = dstW; out.height = dstH;
        const oCtx = out.getContext('2d');
        oCtx.fillStyle = '#fff'; oCtx.fillRect(0,0,dstW,dstH);
        oCtx.beginPath(); oCtx.roundRect(0,0,dstW,dstH, 36); oCtx.clip();
        oCtx.drawImage(canvas, 0, 0);
        return out;
    }

    function saveA4() {
        const card = getCleanCard();
        const a4 = document.createElement('canvas'); a4.width=2480; a4.height=3508;
        const ctx = a4.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,2480,3508);
        ctx.drawImage(card, (2480-1011)/2, 380, 1011, 638);
        const link = document.createElement('a');
        link.download = "신분증_A4.jpg"; link.href = a4.toDataURL("image/jpeg", 1.0); link.click();
    }

    function printCard() {
        const card = getCleanCard();
        const win = window.open();
        win.document.write(`<img src="${card.toDataURL()}" style="width:85.6mm; height:53.98mm;">`);
        setTimeout(() => { win.print(); win.close(); }, 500);
    }
</script>
</body>
</html>

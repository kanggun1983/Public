<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 고해상도 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    /* 100dvh로 수정하여 모바일 주소창 이슈 해결 */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #fff; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    header { height: 50px; background: #1e1e1e; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333; }
    header h1 { font-size: 16px; font-weight: 600; }
    #status { font-size: 12px; color: #ff9800; }
    
    #main-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
    #editor-canvas { max-width: 100%; max-height: 100%; touch-action: none; }
    
    #loupe {
      position: absolute; width: 120px; height: 120px; border: 3px solid #00e676;
      border-radius: 50%; pointer-events: none; display: none; overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8); background: #000; z-index: 100;
    }
    #loupe-canvas { width: 100%; height: 100%; }
    #loupe::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 16px; height: 16px; transform: translate(-50%, -50%);
      border: 1.5px solid #00e676; border-radius: 50%;
    }

    footer { height: 80px; background: #1e1e1e; display: flex; align-items: center; justify-content: space-around; padding: 0 12px; gap: 10px; }
    .btn { flex: 1; height: 50px; border-radius: 8px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-camera { background: #2979ff; color: #fff; }
    .btn-warp { background: #00e676; color: #000; }
    .btn-disabled { opacity: 0.4; pointer-events: none; }

    #result-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
    #result-canvas { max-width: 95%; max-height: 70%; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .modal-actions { margin-top: 20px; display: flex; gap: 12px; width: 100%; max-width: 320px; }
  </style>
</head>
<body>

  <header>
    <h1>고해상도 스캐너</h1>
    <span id="status">로딩 중...</span>
  </header>

  <div id="main-container">
    <canvas id="editor-canvas"></canvas>
    <div id="loupe"><canvas id="loupe-canvas" width="120" height="120"></canvas></div>
  </div>

  <footer>
    <input type="file" id="file-input" accept="image/*" capture="environment" style="display: none;">
    <button class="btn btn-camera" id="btn-shoot">📷 사진 촬영</button>
    <button class="btn btn-warp btn-disabled" id="btn-scan">이대로 펴기</button>
  </footer>

  <div id="result-modal">
    <canvas id="result-canvas"></canvas>
    <div class="modal-actions">
      <button class="btn btn-camera" id="btn-re-edit">다시 수정</button>
      <button class="btn btn-warp" id="btn-download">저장하기</button>
    </div>
  </div>

  <script>
    let cvReady = false;
    function onOpenCvReady() {
      cvReady = true;
      document.getElementById('status').innerText = "준비 완료";
      document.getElementById('status').style.color = "#00e676";
    }

    const fileInput = document.getElementById('file-input');
    const editorCanvas = document.getElementById('editor-canvas');
    const ctx = editorCanvas.getContext('2d');
    const loupe = document.getElementById('loupe');
    const loupeCanvas = document.getElementById('loupe-canvas');
    const loupeCtx = loupeCanvas.getContext('2d');
    const btnScan = document.getElementById('btn-scan');
    const resultModal = document.getElementById('result-modal');
    const resultCanvas = document.getElementById('result-canvas');

    let originalImg = null;
    let points = [];
    let activePointIndex = -1;
    const HANDLE_RADIUS = 20;

    document.getElementById('btn-shoot').onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        originalImg = new Image();
        originalImg.onload = () => {
          setupCanvas();
          btnScan.classList.remove('btn-disabled');
        };
        originalImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    function setupCanvas() {
      const container = document.getElementById('main-container');
      const scale = Math.min(container.clientWidth / originalImg.width, container.clientHeight / originalImg.height);
      editorCanvas.width = originalImg.width * scale;
      editorCanvas.height = originalImg.height * scale;
      const w = editorCanvas.width, h = editorCanvas.height;
      points = [{x: w*0.2, y: h*0.25}, {x: w*0.8, y: h*0.25}, {x: w*0.8, y: h*0.75}, {x: w*0.2, y: h*0.75}];
      render();
    }

    function render() {
      ctx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
      ctx.drawImage(originalImg, 0, 0, editorCanvas.width, editorCanvas.height);
      ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 230, 118, 0.2)'; ctx.fill();
      ctx.strokeStyle = '#00e676'; ctx.lineWidth = 3; ctx.stroke();

      points.forEach((p, idx) => {
        ctx.beginPath(); ctx.arc(p.x, p.y, HANDLE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = (activePointIndex === idx) ? '#ffea00' : '#ff1744';
        ctx.fill();
      });
    }

    function updateLoupe(point, touch) {
      loupe.style.display = 'block';
      loupe.style.left = `${touch.x - 60}px`; loupe.style.top = `${touch.y - 180}px`;
      loupeCtx.clearRect(0, 0, 120, 120);
      const zoom = 2;
      loupeCtx.drawImage(editorCanvas, point.x - 30, point.y - 30, 60, 60, 0, 0, 120, 120);
    }

    const getCoords = (e) => {
      const rect = editorCanvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return { x, y, sx: e.touches ? e.touches[0].clientX : e.clientX, sy: e.touches ? e.touches[0].clientY : e.clientY };
    };

    function onStart(e) {
      if (!originalImg) return;
      const c = getCoords(e);
      activePointIndex = points.findIndex(p => Math.hypot(p.x - c.x, p.y - c.y) < HANDLE_RADIUS * 2);
      if (activePointIndex !== -1) updateLoupe(points[activePointIndex], { x: c.sx, y: c.sy });
    }

    function onMove(e) {
      if (activePointIndex === -1) return;
      e.preventDefault();
      const c = getCoords(e);
      points[activePointIndex].x = Math.max(0, Math.min(editorCanvas.width, c.x));
      points[activePointIndex].y = Math.max(0, Math.min(editorCanvas.height, c.y));
      render();
      updateLoupe(points[activePointIndex], { x: c.sx, y: c.sy });
    }

    function onEnd() { activePointIndex = -1; loupe.style.display = 'none'; render(); }

    editorCanvas.addEventListener('touchstart', onStart, { passive: false });
    editorCanvas.addEventListener('touchmove', onMove, { passive: false });
    editorCanvas.addEventListener('touchend', onEnd);
    editorCanvas.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    btnScan.onclick = () => {
      if (!cvReady) return;
      // 300 DPI 기준 실물 크기 픽셀 (1011x638)
      const dstW = 1011, dstH = 638;
      const sx = originalImg.width / editorCanvas.width, sy = originalImg.height / editorCanvas.height;
      const srcMat = cv.imread(originalImg);
      const dstMat = new cv.Mat();
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, points.flatMap(p => [p.x * sx, p.y * sy]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dstW, 0, dstW, dstH, 0, dstH]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      cv.warpPerspective(srcMat, dstMat, M, new cv.Size(dstW, dstH), cv.INTER_LINEAR);
      resultCanvas.width = dstW; resultCanvas.height = dstH;
      cv.imshow(resultCanvas, dstMat);
      srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();
      resultModal.style.display = 'flex';
    };

    document.getElementById('btn-re-edit').onclick = () => resultModal.style.display = 'none';
    document.getElementById('btn-download').onclick = () => {
      const link = document.createElement('a');
      link.download = `ID_SCAN_300DPI_${Date.now()}.jpg`;
      link.href = resultCanvas.toDataURL('image/jpeg', 0.95);
      link.click();
    };
  </script>
</body>
</html>

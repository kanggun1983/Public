<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 스마트 자동 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 44px; background: #181818; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid #2c2c2c; z-index: 10; }
    header h1 { font-size: 15px; font-weight: 600; }
    #mode-label { font-size: 12px; color: #00e676; font-weight: bold; }

    #main-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
    
    /* 실시간 카메라 뷰 */
    #camera-view { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 카메라 가이드 오버레이 */
    #guide-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #guide-box {
      width: 86vw;
      max-width: 360px;
      aspect-ratio: 1.586 / 1;
      border: 3.5px solid #00e676;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #guide-box.detecting { border-color: #ffea00; }
    #guide-box.captured { border-color: #ffffff; box-shadow: 0 0 0 9999px rgba(255, 255, 255, 0.8); }

    #guide-msg {
      margin-top: 25px;
      font-size: 13px;
      color: #00e676;
      background: rgba(0,0,0,0.75);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 500;
      text-align: center;
    }

    /* 수동 편집 캔버스 (앨범용) */
    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; position: absolute; top:0; left:0; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; }

    /* 모서리 확대경 */
    #loupe-container { 
      position: absolute; bottom: 130px; right: 12px; width: 130px; height: 130px; 
      border: 2.5px solid #00e676; border-radius: 10px; background: #181818; 
      z-index: 50; display: none; pointer-events: none; overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.9);
    }
    #loupe-canvas { width: 100%; height: 100%; }
    #loupe-label { position: absolute; top: 4px; left: 6px; font-size: 11px; font-weight: bold; color: #00e676; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 4px; z-index: 10; }

    /* 하단 조작 패널 */
    #control-panel { height: 110px; background: #181818; display: flex; align-items: center; justify-content: space-around; padding: 10px; border-top: 1px solid #2c2c2c; z-index: 10; }
    .dpad { display: none; grid-template-columns: 45px 45px 45px; grid-template-rows: 45px 45px; gap: 3px; }
    .dpad button { background: #2e2e2e; color: white; border: 1px solid #444; border-radius: 8px; font-size: 16px; font-weight: bold; touch-action: manipulation; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .actions { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 340px; }
    .btn-row { display: flex; gap: 8px; width: 100%; }
    .btn { 
      height: 44px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; 
      cursor: pointer; display: flex; align-items: center; justify-content: center; 
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .btn-camera { background: #00e676; color: black; font-size: 15px; font-weight: bold; }
    .btn-album { background: #37474f; color: white; }
    .btn-warp { background: #00e676; color: black; font-size: 15px; font-weight: bold; }
    .btn-print { background: #9c27b0; color: white; }
    
    /* 결과 모달 */
    #result-modal { 
      position: fixed; top:0; left:0; width:100%; height:100%; 
      background:rgba(0,0,0,0.96); display:none; flex-direction:column; 
      align-items:center; justify-content:center; z-index:99999; 
    }
    #result-canvas { max-width: 95vw; max-height: 65vh; object-fit: contain; border: 2px solid #fff; border-radius: 6px; }

    /* A4 1:1 출력 전용 */
    #print-area { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      body { background: #fff !important; }
      body > * { display: none !important; }
      #print-area {
        display: block !important;
        position: absolute;
        left: 20mm;
        top: 20mm;
        width: 85.6mm;
        height: 53.98mm;
      }
      #print-area img {
        width: 85.6mm;
        height: 53.98mm;
        display: block;
        object-fit: fill;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>신분증 자동 스캐너</h1>
    <span id="mode-label">⚡ 실시간 자동 감지 중</span>
  </header>

  <div id="main-container">
    <!-- 실시간 카메라 & 자동 가이드 -->
    <div id="camera-view">
      <video id="video" autoplay playsinline muted></video>
      <div id="guide-overlay">
        <div id="guide-box"></div>
        <div id="guide-msg">신분증을 초록 사각형에 맞춰주세요</div>
      </div>
    </div>

    <!-- 앨범 사진 수동 편집기 -->
    <div id="editor-view">
      <canvas id="editor-canvas"></canvas>
      <div id="loupe-container">
        <span id="loupe-label">모서리</span>
        <canvas id="loupe-canvas" width="130" height="130"></canvas>
      </div>
    </div>
  </div>

  <div id="control-panel">
    <div class="dpad" id="dpad-box">
      <div></div><button onclick="nudge(0,-2)">▲</button><div></div>
      <button onclick="nudge(-2,0)">◀</button><button onclick="nudge(0,2)">▼</button><button onclick="nudge(2,0)">▶</button>
    </div>

    <div class="actions">
      <input type="file" id="album-input" accept="image/*" style="display: none;">
      
      <div class="btn-row" id="cam-actions">
        <button class="btn btn-album" style="flex: 1;" onclick="document.getElementById('album-input').click()">🖼️ 앨범 선택</button>
        <button class="btn btn-camera" style="flex: 1.5;" onclick="triggerCapture()">📸 수동 촬영</button>
      </div>

      <div class="btn-row" id="edit-actions" style="display: none;">
        <button class="btn btn-album" style="flex: 1;" onclick="backToCamera()">📷 카메라로</button>
        <button class="btn btn-warp" style="flex: 1.5;" onclick="processManualScan()">완료</button>
      </div>
    </div>
  </div>

  <div id="result-modal">
    <canvas id="result-canvas"></canvas>
    <div style="display: flex; gap: 8px; margin-top: 18px; width: 92%; max-width: 400px; z-index: 100000;">
      <button class="btn btn-album" style="flex: 1;" onclick="restartAutoScan()">다시 촬영</button>
      <button class="btn btn-print" style="flex: 1.2;" onclick="printA4()">🖨️ A4 인쇄</button>
      <button class="btn btn-warp" style="flex: 1.2;" onclick="downloadResult()">저장(JPG)</button>
    </div>
  </div>

  <div id="print-area"><img id="print-img" alt="신분증 인쇄"></div>

  <script>
    let cvReady = false, stream = null;
    let originalImg = null, points = [], activeIdx = 0, scaleX = 1, scaleY = 1;
    let autoScanInterval = null, stabilityCount = 0, isCaptured = false;
    const cornerNames = ["좌상단 ┌", "우상단 ┐", "우하단 ┘", "좌하단 └"];

    function onOpenCvReady() { 
      cvReady = true; 
    }

    // 비프음 생성 (Web Audio API)
    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e){}
    }

    async function startCamera() {
      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          startAutoDetection();
        };
      } catch (err) {
        alert("카메라 권한을 허용해주세요.");
      }
    }
    window.addEventListener('load', startCamera);

    // 실시간 신분증 자동 정렬 & 자동 셔터 루프 (초당 8회 검사)
    function startAutoDetection() {
      if (autoScanInterval) clearInterval(autoScanInterval);
      const tempCanvas = document.createElement('canvas');
      const tCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
      tempCanvas.width = 160;
      tempCanvas.height = 100;

      autoScanInterval = setInterval(() => {
        if (isCaptured || document.getElementById('camera-view').style.display === 'none') return;
        const video = document.getElementById('video');
        if (!video.videoWidth || video.readyState < 2) return;

        const vRect = video.getBoundingClientRect();
        const gRect = document.getElementById('guide-box').getBoundingClientRect();
        const scale = Math.max(video.videoWidth / vRect.width, video.videoHeight / vRect.height);
        const offsetX = (vRect.width - (video.videoWidth / scale)) / 2;
        const offsetY = (vRect.height - (video.videoHeight / scale)) / 2;

        const cropX = (gRect.left - vRect.left - offsetX) * scale;
        const cropY = (gRect.top - vRect.top - offsetY) * scale;
        const cropW = gRect.width * scale;
        const cropH = gRect.height * scale;

        tCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 160, 100);
        const imgData = tCtx.getImageData(0, 0, 160, 100);
        const data = imgData.data;

        // 명암 분산도 및 카드 영역 검출
        let brightnessSum = 0, count = data.length / 4;
        for (let i = 0; i < data.length; i += 4) {
          brightnessSum += (data[i] + data[i+1] + data[i+2]) / 3;
        }
        let mean = brightnessSum / count;
        let variance = 0;
        for (let i = 0; i < data.length; i += 4) {
          let b = (data[i] + data[i+1] + data[i+2]) / 3;
          variance += (b - mean) * (b - mean);
        }
        let stdDev = Math.sqrt(variance / count);

        const gBox = document.getElementById('guide-box');
        const gMsg = document.getElementById('guide-msg');

        // 카드가 틀 안에 들어왔을 때 (표준 밝기 60~225 및 텍스트/사진 대비 stdDev > 22)
        if (mean > 60 && mean < 225 && stdDev > 22) {
          stabilityCount++;
          gBox.classList.add('detecting');
          gMsg.innerText = `신분증 감지됨! 그대로 유지하세요 (${stabilityCount}/3)`;
          gMsg.style.color = '#ffea00';

          // 0.8초 동안 흔들림 없이 유지되면 자동 촬영
          if (stabilityCount >= 3) {
            triggerCapture();
          }
        } else {
          stabilityCount = 0;
          gBox.classList.remove('detecting');
          gMsg.innerText = '신분증을 초록 사각형에 맞춰주세요';
          gMsg.style.color = '#00e676';
        }
      }, 250);
    }

    // 셔터 격발 (자동 또는 수동 버튼)
    function triggerCapture() {
      if (isCaptured) return;
      isCaptured = true;

      const gBox = document.getElementById('guide-box');
      gBox.classList.add('captured');
      playBeep();
      if (navigator.vibrate) navigator.vibrate(80);

      setTimeout(() => {
        gBox.classList.remove('captured', 'detecting');
        captureFromGuide();
      }, 150);
    }

    function captureFromGuide() {
      const video = document.getElementById('video');
      const guideBox = document.getElementById('guide-box');
      if (!video.videoWidth) return;

      const vRect = video.getBoundingClientRect();
      const gRect = guideBox.getBoundingClientRect();
      const scale = Math.max(video.videoWidth / vRect.width, video.videoHeight / vRect.height);
      const offsetX = (vRect.width - (video.videoWidth / scale)) / 2;
      const offsetY = (vRect.height - (video.videoHeight / scale)) / 2;

      const cropX = (gRect.left - vRect.left - offsetX) * scale;
      const cropY = (gRect.top - vRect.top - offsetY) * scale;
      const cropW = gRect.width * scale;
      const cropH = gRect.height * scale;

      const rCanvas = document.getElementById('result-canvas');
      rCanvas.width = 1011;
      rCanvas.height = 638;
      const ctx = rCanvas.getContext('2d');
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 1011, 638);
      document.getElementById('result-modal').style.display = 'flex';
    }

    function restartAutoScan() {
      document.getElementById('result-modal').style.display = 'none';
      isCaptured = false;
      stabilityCount = 0;
    }

    // 앨범 선택 및 수동 모드
    document.getElementById('album-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      isCaptured = true;

      const reader = new FileReader();
      reader.onload = (event) => {
        const tempImg = new Image();
        tempImg.onload = () => {
          originalImg = tempImg;
          switchToEditMode();
        };
        tempImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    };

    function switchToEditMode() {
      document.getElementById('camera-view').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('cam-actions').style.display = 'none';
      document.getElementById('edit-actions').style.display = 'flex';
      document.getElementById('dpad-box').style.display = 'grid';
      document.getElementById('mode-label').innerText = "✏️ 앨범 정밀 편집";

      const container = document.getElementById('main-container');
      const scale = Math.min(container.clientWidth / originalImg.width, container.clientHeight / originalImg.height);
      const canvas = document.getElementById('editor-canvas');
      canvas.width = Math.round(originalImg.width * scale);
      canvas.height = Math.round(originalImg.height * scale);
      scaleX = originalImg.width / canvas.width;
      scaleY = originalImg.height / canvas.height;

      const w = canvas.width, h = canvas.height;
      const cardW = Math.min(w * 0.75, h * 0.75 * 1.586);
      const cardH = cardW / 1.586;
      const startX = (w - cardW) / 2, startY = (h - cardH) / 2;

      points = [
        { x: startX, y: startY },
        { x: startX + cardW, y: startY },
        { x: startX + cardW, y: startY + cardH },
        { x: startX, y: startY + cardH }
      ];
      activeIdx = 0;
      render();
    }

    function backToCamera() {
      document.getElementById('editor-view').style.display = 'none';
      document.getElementById('camera-view').style.display = 'flex';
      document.getElementById('edit-actions').style.display = 'none';
      document.getElementById('cam-actions').style.display = 'flex';
      document.getElementById('dpad-box').style.display = 'none';
      document.getElementById('mode-label').innerText = "⚡ 실시간 자동 감지 중";
      isCaptured = false;
      stabilityCount = 0;
      startCamera();
    }

    function render() {
      const canvas = document.getElementById('editor-canvas');
      if (!canvas || !originalImg) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 230, 118, 0.18)';
      ctx.fill();
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 3;
      ctx.stroke();

      points.forEach((p, i) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
        ctx.fillStyle = (activeIdx === i) ? '#ffea00' : '#ff1744';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      });

      updateLoupe();
    }

    function updateLoupe() {
      const loupe = document.getElementById('loupe-container');
      const lCanvas = document.getElementById('loupe-canvas');
      const lCtx = lCanvas.getContext('2d');
      document.getElementById('loupe-label').innerText = cornerNames[activeIdx];
      loupe.style.display = 'block';

      const p = points[activeIdx];
      const cx = 65, cy = 65;
      const viewSize = 50;
      const cropW = viewSize * scaleX, cropH = viewSize * scaleY;
      const cropX = (p.x * scaleX) - (cropW / 2), cropY = (p.y * scaleY) - (cropH / 2);

      lCtx.fillStyle = '#181818';
      lCtx.fillRect(0, 0, 130, 130);
      try {
        lCtx.drawImage(originalImg, cropX, cropY, cropW, cropH, 0, 0, 130, 130);
      } catch(e){}

      lCtx.save();
      lCtx.lineWidth = 3.5;
      lCtx.strokeStyle = '#ff1744';
      lCtx.beginPath();
      const arm = 30;
      if (activeIdx === 0) { lCtx.moveTo(cx + arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy + arm); }
      else if (activeIdx === 1) { lCtx.moveTo(cx - arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy + arm); }
      else if (activeIdx === 2) { lCtx.moveTo(cx - arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy - arm); }
      else if (activeIdx === 3) { lCtx.moveTo(cx + arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy - arm); }
      lCtx.stroke();
      lCtx.fillStyle = '#ffea00';
      lCtx.beginPath(); lCtx.arc(cx, cy, 3, 0, Math.PI * 2); lCtx.fill();
      lCtx.restore();
    }

    function nudge(dx, dy) {
      if (activeIdx === -1) return;
      const canvas = document.getElementById('editor-canvas');
      points[activeIdx].x = Math.max(0, Math.min(canvas.width, points[activeIdx].x + dx));
      points[activeIdx].y = Math.max(0, Math.min(canvas.height, points[activeIdx].y + dy));
      render();
    }

    const canvas = document.getElementById('editor-canvas');
    function handleTouch(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const found = points.findIndex(p => Math.hypot(p.x - (cx - rect.left), p.y - (cy - rect.top)) < 45);
      if (found !== -1) { activeIdx = found; render(); }
    }
    function handleDrag(e) {
      if (activeIdx === -1) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      points[activeIdx].x = Math.max(0, Math.min(canvas.width, cx - rect.left));
      points[activeIdx].y = Math.max(0, Math.min(canvas.height, cy - rect.top));
      render();
    }
    canvas.addEventListener('mousedown', handleTouch);
    canvas.addEventListener('touchstart', handleTouch);
    canvas.addEventListener('mousemove', handleDrag);
    canvas.addEventListener('touchmove', handleDrag, {passive:false});

    function processManualScan() {
      if (!cvReady || !originalImg) return;
      const dstW = 1011, dstH = 638;
      const srcMat = cv.imread(originalImg);
      const dstMat = new cv.Mat();
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, points.flatMap(p => [p.x * scaleX, p.y * scaleY]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dstW, 0, dstW, dstH, 0, dstH]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      cv.warpPerspective(srcMat, dstMat, M, new cv.Size(dstW, dstH), cv.INTER_LINEAR);
      
      const rCanvas = document.getElementById('result-canvas');
      rCanvas.width = dstW; rCanvas.height = dstH;
      cv.imshow(rCanvas, dstMat);
      document.getElementById('result-modal').style.display = 'flex';
      srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();
    }

    async function downloadResult() {
      const rCanvas = document.getElementById('result-canvas');
      const filename = `신분증스캔_${Date.now()}.jpg`;

      rCanvas.toBlob(async (blob) => {
        if (!blob) return alert("이미지 생성에 실패했습니다.");
        const file = new File([blob], filename, { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: '신분증 스캔본' });
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
      }, 'image/jpeg', 0.95);
    }

    function printA4() {
      const dataUrl = document.getElementById('result-canvas').toDataURL('image/jpeg', 1.0);
      const pImg = document.getElementById('print-img');
      pImg.src = dataUrl;
      pImg.onload = () => window.print();
    }

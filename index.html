<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 정밀 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d0d0d; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 44px; background: #181818; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid #2c2c2c; z-index: 20; }
    header h1 { font-size: 15px; font-weight: 600; }
    #status-badge { font-size: 11px; font-weight: bold; color: #00e676; background: #222; padding: 3px 8px; border-radius: 12px; border: 1px solid #333; }

    #main-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
    
    #upload-view {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; width: 85%; max-width: 340px; padding: 36px 20px;
      border: 2px dashed #444; border-radius: 16px; background: #141414; text-align: center; cursor: pointer;
    }
    #upload-view:active { border-color: #00e676; background: #1a1a1a; }
    .upload-icon { font-size: 48px; }
    .upload-title { font-size: 16px; font-weight: bold; color: #fff; }
    .upload-desc { font-size: 12px; color: #888; line-height: 1.5; }

    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; }

    #loupe-container { 
      position: absolute; width: 140px; height: 140px; 
      border: 2.5px solid #00e676; border-radius: 12px; background: #181818; 
      z-index: 50; display: none; pointer-events: none; overflow: hidden;
      box-shadow: 0 6px 22px rgba(0,0,0,0.95);
      transition: top 0.2s, bottom 0.2s;
    }
    #loupe-canvas { width: 100%; height: 100%; }
    #loupe-label { position: absolute; top: 4px; left: 6px; font-size: 11px; font-weight: bold; color: #00e676; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; z-index: 10; }

    #control-panel { background: #181818; display: none; flex-direction: column; padding: 6px 10px; border-top: 1px solid #2c2c2c; z-index: 30; gap: 6px; }
    
    #corner-selector { display: flex; align-items: center; justify-content: space-between; gap: 4px; width: 100%; max-width: 380px; margin: 0 auto; }
    .corner-btn { flex: 1; height: 32px; background: #262626; color: #bbb; border: 1px solid #444; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .corner-btn.active { background: #00e676; color: #000; border-color: #00e676; }
    #step-btn { width: 55px; height: 32px; background: #ff9800; color: #000; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }

    #panel-main { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 380px; margin: 0 auto; }

    .dpad { display: grid; grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px; gap: 3px; }
    .dpad button { background: #2e2e2e; color: white; border: 1px solid #444; border-radius: 8px; font-size: 17px; font-weight: bold; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .actions { display: flex; flex-direction: column; gap: 6px; flex: 1; margin-left: 8px; }
    .btn-row { display: flex; gap: 5px; width: 100%; }
    .btn { 
      height: 44px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; 
      cursor: pointer; display: flex; align-items: center; justify-content: center; 
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .btn-album { background: #37474f; color: white; }
    .btn-warp { background: #00e676; color: black; font-size: 14px; font-weight: bold; }
    .btn-print { background: #9c27b0; color: white; }

    #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,230,118,0.95); color: #000; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 9999; display: none; }

    #print-area { display: none; }
    @media print {
      @page { size: auto; margin: 0mm; }
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; display: flex; justify-content: center; padding-top: 10mm; }
      #print-img { width: 85.6mm !important; height: 53.98mm !important; display: block !important; border: none !important; outline: none !important; }
    }
  </style>
</head>
<body>

  <header>
    <h1>신분증 정밀 스캐너</h1>
    <span id="status-badge">준비 완료</span>
  </header>

  <div id="toast">처리 완료!</div>
  <input type="file" id="album-input" accept="image/*" style="display: none;">

  <div id="main-container">
    <div id="upload-view" onclick="document.getElementById('album-input').click()">
      <div class="upload-icon">🖼️</div>
      <div class="upload-title">갤러리에서 사진 선택</div>
      <div class="upload-desc">스캔할 신분증 사진을 불러오면<br>자동으로 정밀 편집 화면이 열립니다.</div>
    </div>
    <div id="editor-view">
      <canvas id="editor-canvas"></canvas>
      <div id="loupe-container">
        <span id="loupe-label">모서리</span>
        <canvas id="loupe-canvas" width="140" height="140"></canvas>
      </div>
    </div>
  </div>

  <div id="control-panel">
    <div id="corner-selector">
      <button class="corner-btn active" onclick="selectCorner(0)">┌ 좌상</button>
      <button class="corner-btn" onclick="selectCorner(1)">┐ 우상</button>
      <button class="corner-btn" onclick="selectCorner(2)">┘ 우하</button>
      <button class="corner-btn" onclick="selectCorner(3)">└ 좌하</button>
      <button id="step-btn" onclick="toggleStep()">0.5px</button>
    </div>

    <div id="panel-main">
      <div class="dpad" id="dpad-box">
        <div></div><button id="btn-up">▲</button><div></div>
        <button id="btn-left">◀</button><button id="btn-down">▼</button><button id="btn-right">▶</button>
      </div>
      <div class="actions">
        <div class="btn-row">
          <button class="btn btn-album" style="flex: 0.9;" onclick="document.getElementById('album-input').click()">🖼️ 변경</button>
          <button class="btn btn-print" style="flex: 1;" onclick="printA4()">🖨️ 인쇄</button>
          <button class="btn btn-warp" style="flex: 1.4;" onclick="saveA4Document()">💾 갤러리 저장</button>
        </div>
      </div>
    </div>
  </div>

  <div id="print-area"><img id="print-img" alt="신분증 인쇄"></div>

  <script>
    let cvReady = false, originalImg = null, points = [], activeIdx = 0, scaleX = 1, scaleY = 1, stepSize = 0.5, nudgeTimer = null, nudgeInterval = null, renderRequested = false;
    const cornerNames = ["좌상단 ┌", "우상단 ┐", "우하단 ┘", "좌하단 └"];

    function onOpenCvReady() { cvReady = true; }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2000); }
    function toggleStep() { stepSize = (stepSize === 0.5 ? 2.0 : 0.5); document.getElementById('step-btn').innerText = stepSize + "px"; requestSafeRender(); }

    document.getElementById('album-input').onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (event) => { originalImg = new Image(); originalImg.onload = openEditorView; originalImg.src = event.target.result; };
      reader.readAsDataURL(e.target.files[0]);
    };

    function openEditorView() {
      document.getElementById('upload-view').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('control-panel').style.display = 'flex';
      const canvas = document.getElementById('editor-canvas');
      const scale = Math.min(window.innerWidth/originalImg.width, (window.innerHeight*0.5)/originalImg.height);
      canvas.width = originalImg.width * scale; canvas.height = originalImg.height * scale;
      scaleX = originalImg.width / canvas.width; scaleY = originalImg.height / canvas.height;
      const w=canvas.width, h=canvas.height, cw=w*0.7, ch=cw/1.586;
      points = [{x:(w-cw)/2, y:(h-ch)/2}, {x:(w+cw)/2, y:(h-ch)/2}, {x:(w+cw)/2, y:(h+ch)/2}, {x:(w-cw)/2, y:(h+ch)/2}];
      render();
    }

    function render() {
      const ctx = document.getElementById('editor-canvas').getContext('2d');
      ctx.clearRect(0,0,ctx.canvas.width, ctx.canvas.height);
      ctx.drawImage(originalImg, 0, 0, ctx.canvas.width, ctx.canvas.height);
      ctx.strokeStyle = '#00e676'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y); points.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.closePath(); ctx.stroke();
      points.forEach((p, i) => { ctx.fillStyle = (i === activeIdx) ? '#ffea00' : '#ff1744'; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, 7); ctx.fill(); });
      updateLoupe();
    }

    function requestSafeRender() { if (!renderRequested) { renderRequested = true; requestAnimationFrame(() => { render(); renderRequested = false; }); } }
    function selectCorner(idx) { activeIdx = idx; document.querySelectorAll('.corner-btn').forEach((b,i)=>b.className='corner-btn'+(i===idx?' active':'')); requestSafeRender(); }

    function updateLoupe() {
      const lCtx = document.getElementById('loupe-canvas').getContext('2d');
      const p = points[activeIdx];
      lCtx.drawImage(originalImg, p.x*scaleX-35, p.y*scaleY-35, 70, 70, 0, 0, 140, 140);
      document.getElementById('loupe-container').style.display = 'block';
    }

    function applyNudge(dx, dy) {
      points[activeIdx].x = Math.max(0, Math.min(canvas.width, points[activeIdx].x + dx*stepSize));
      points[activeIdx].y = Math.max(0, Math.min(canvas.height, points[activeIdx].y + dy*stepSize));
      requestSafeRender();
    }

    function bindDpad(id, dx, dy) {
      const btn = document.getElementById(id);
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); stopNudge(); applyNudge(dx, dy); nudgeTimer = setTimeout(() => { nudgeInterval = setInterval(()=>applyNudge(dx,dy), 60); }, 280); });
      btn.addEventListener('pointerup', stopNudge); btn.addEventListener('pointerleave', stopNudge);
    }
    function stopNudge() { clearTimeout(nudgeTimer); clearInterval(nudgeInterval); }
    bindDpad('btn-up', 0, -1); bindDpad('btn-down', 0, 1); bindDpad('btn-left', -1, 0); bindDpad('btn-right', 1, 0);

    const canvas = document.getElementById('editor-canvas');
    canvas.addEventListener('pointermove', (e) => { if(e.buttons === 1) { const r = canvas.getBoundingClientRect(); points[activeIdx] = {x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height)}; requestSafeRender(); } });
    canvas.addEventListener('pointerdown', (e) => { const r = canvas.getBoundingClientRect(); const x=(e.clientX-r.left)*(canvas.width/r.width), y=(e.clientY-r.top)*(canvas.height/r.height); points.forEach((p,i)=>{if(Math.hypot(p.x-x, p.y-y)<50) selectCorner(i);}); });

    function getCleanCardCanvas() {
      const dstW=1011, dstH=638; const c = document.createElement('canvas'); c.width=dstW; c.height=dstH; const ctx = c.getContext('2d');
      const sM = cv.imread(originalImg); const dM = new cv.Mat(); const sT = cv.matFromArray(4,1,cv.CV_32FC2, points.flatMap(p=>[p.x*scaleX, p.y*scaleY]));
      const dT = cv.matFromArray(4,1,cv.CV_32FC2, [0,0, dstW,0, dstW,dstH, 0,dstH]); const M = cv.getPerspectiveTransform(sT, dT);
      cv.warpPerspective(sM, dM, M, new cv.Size(dstW,dstH), cv.INTER_CUBIC); cv.imshow(c, dM); sM.delete(); dM.delete(); sT.delete(); dT.delete(); M.delete();
      const out = document.createElement('canvas'); out.width=dstW; out.height=dstH; const o = out.getContext('2d');
      o.fillStyle='#fff'; o.fillRect(0,0,dstW,dstH); o.beginPath(); o.roundRect(0,0,dstW,dstH, 36); o.clip(); o.drawImage(c,0,0); return out;
    }

    function printA4() { document.getElementById('print-img').src = getCleanCardCanvas().toDataURL('image/jpeg', 1.0); window.print(); }

    async function saveA4Document() {
        const card = getCleanCardCanvas();
        const a4 = document.createElement('canvas'); a4.width=2480; a4.height=3508;
        const ctx = a4.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,2480,3508);
        ctx.drawImage(card, (2480-1011)/2, 380, 1011, 638);
        a4.toBlob(async (blob) => {
            const file = new File([blob], "ID_Scan.jpg", { type: 'image/jpeg' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file] });
            } else {
                const a = document.createElement('a'); a.download="ID_Scan.jpg"; a.href=URL.createObjectURL(blob); a.click();
            }
            showToast("갤러리 저장 요청 완료!");
        }, 'image/jpeg', 1.0);
    }
  </script>
</body>
</html>

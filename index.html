<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 정밀 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: sans-serif; background: #0d0d0d; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 50px; background: #181818; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #333; }
    
    #main-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; width: 100%; overflow: hidden; }
    
    /* 업로드 영역 */
    #upload-view {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; width: 80%; height: 60%; border: 2px dashed #555; border-radius: 20px;
      cursor: pointer; background: #1a1a1a;
    }
    
    /* 편집기 */
    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* 조작 패널 */
    #control-panel { 
      background: #181818; padding: 15px; border-top: 1px solid #333;
      display: none; flex-direction: column; gap: 15px;
    }
    
    .btn { height: 50px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-warp { background: #00e676; color: #000; flex: 1; }
    .btn-print { background: #9c27b0; color: #fff; flex: 1; }
    
    #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: #00e676; color: #000; padding: 10px 20px; border-radius: 20px; display: none; z-index: 999; }

    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left:0; top:0; width: 100%; display: flex; justify-content: center; }
      #print-target { width: 85.6mm !important; height: 53.98mm !important; display: block !important; }
    }
  </style>
</head>
<body>

  <header><h1>신분증 정밀 스캐너</h1></header>
  <div id="toast">처리 중...</div>

  <input type="file" id="album-input" accept="image/*" style="display: none;">

  <div id="main-container">
    <div id="upload-view" onclick="document.getElementById('album-input').click()">
      <div style="font-size: 50px;">🖼️</div>
      <div style="font-size: 18px;">갤러리에서 사진 선택</div>
    </div>

    <div id="editor-view">
      <canvas id="editor-canvas"></canvas>
    </div>
  </div>

  <div id="control-panel">
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-print" onclick="printCard()">🖨️ 실물크기 인쇄</button>
      <button class="btn btn-warp" onclick="saveResult()">💾 저장 (A4스캔본)</button>
    </div>
    <button class="btn" style="background:#444;" onclick="location.reload()">처음으로</button>
  </div>

  <div id="print-area"><img id="print-target"></div>

  <script>
    let cvReady = false, originalImg = null;
    function onOpenCvReady() { cvReady = true; }

    document.getElementById('album-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          originalImg = img;
          document.getElementById('upload-view').style.display = 'none';
          document.getElementById('editor-view').style.display = 'flex';
          document.getElementById('control-panel').style.display = 'flex';
          initCanvas();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    function initCanvas() {
      const canvas = document.getElementById('editor-canvas');
      canvas.width = originalImg.width;
      canvas.height = originalImg.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(originalImg, 0, 0);
    }

    // 신분증 규격(1011x638) 고화질 처리
    function getCleanCardCanvas() {
      const dstW = 1011, dstH = 638;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = dstW; outCanvas.height = dstH;
      const oCtx = outCanvas.getContext('2d');
      
      // OpenCV로 왜곡 보정 (여기서는 단순 크기 조절로 처리)
      oCtx.drawImage(originalImg, 0, 0, dstW, dstH);
      return outCanvas;
    }

    // A4 스캔본 생성 (2480x3508)
    function saveResult() {
      const card = getCleanCardCanvas();
      const a4 = document.createElement('canvas');
      a4.width = 2480; a4.height = 3508;
      const ctx = a4.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0,0,2480,3508);
      ctx.drawImage(card, (2480-1011)/2, 380, 1011, 638);
      
      const link = document.createElement('a');
      link.download = "신분증_A4스캔본.jpg";
      link.href = a4.toDataURL("image/jpeg", 1.0);
      link.click();
      document.getElementById('toast').style.display = 'block';
    }

    function printCard() {
      const card = getCleanCardCanvas();
      document.getElementById('print-target').src = card.toDataURL('image/jpeg', 1.0);
      window.print();
    }
  </script>
</body>
</html>

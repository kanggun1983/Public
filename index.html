<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 정밀 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body { font-family: sans-serif; background: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 45px; background: #111; display: flex; align-items: center; justify-content: center; font-weight: bold; border-bottom: 1px solid #333; }
    
    /* 화면 영역 */
    #main-container { flex: 1; position: relative; width: 100%; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
    #upload-view { width: 80%; height: 200px; border: 2px dashed #666; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; cursor: pointer; background: #1a1a1a; border-radius: 20px; }
    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; position: absolute; top:0; left:0; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* 컨트롤 패널 (항상 하단에 고정) */
    #control-panel { 
        height: 270px; background: #181818; padding: 10px; border-top: 2px solid #333;
        display: none; flex-direction: column; gap: 10px; z-index: 100;
    }
    
    /* 도구 탭 */
    .row-tools { display: flex; gap: 5px; width: 100%; justify-content: center; }
    .corner-btn { padding: 8px 12px; background: #333; border: 1px solid #555; color: #fff; border-radius: 5px; font-size: 13px; }
    .corner-btn.active { background: #00e676; color: #000; font-weight: bold; }
    #step-btn { width: 60px; background: #ff9800; color: #000; border: none; border-radius: 5px; font-weight: bold; }
    
    /* D-Pad 및 액션 */
    .bottom-layout { display: flex; gap: 15px; align-items: center; justify-content: center; }
    .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; gap: 5px; }
    .dpad button { background: #444; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .actions { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .btn { height: 50px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    
    #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: #00e676; color: #000; padding: 10px 20px; border-radius: 20px; display: none; z-index: 999; }
  </style>
</head>
<body>

<header>신분증 정밀 스캐너</header>
<div id="toast">처리 완료!</div>
<input type="file" id="album-input" accept="image/*" style="display: none;">

<div id="main-container">
    <div id="upload-view" onclick="document.getElementById('album-input').click()">
        <div style="font-size: 40px;">🖼️</div>
        <div>갤러리에서 사진 선택</div>
    </div>
    <div id="editor-view">
        <canvas id="editor-canvas"></canvas>
    </div>
</div>

<div id="control-panel">
    <div class="row-tools">
        <button class="corner-btn" onclick="selectCorner(0)">┌ 좌상</button>
        <button class="corner-btn" onclick="selectCorner(1)">┐ 우상</button>
        <button class="corner-btn" onclick="selectCorner(2)">┘ 우하</button>
        <button class="corner-btn" onclick="selectCorner(3)">└ 좌하</button>
        <button id="step-btn" onclick="toggleStep()">0.5px</button>
    </div>
    
    <div class="bottom-layout">
        <div class="dpad">
            <div></div><button onpointerdown="startNudge(0,-1)" onpointerup="stopNudge()">▲</button><div></div>
            <button onpointerdown="startNudge(-1,0)" onpointerup="stopNudge()">◀</button>
            <button onpointerdown="startNudge(0,1)" onpointerup="stopNudge()">▼</button>
            <button onpointerdown="startNudge(1,0)" onpointerup="stopNudge()">▶</button>
        </div>
        <div class="actions">
            <button class="btn" style="background:#9c27b0; color:#fff;" onclick="printA4()">🖨️ 실물크기 인쇄</button>
            <button class="btn" style="background:#00e676; color:#000;" onclick="saveResult()">💾 저장 (JPG)</button>
        </div>
    </div>
</div>

<div id="print-area" style="display:none;"><img id="print-img"></div>

<script>
    let cvReady = false, originalImg = null, points = [], activeIdx = 0, stepSize = 0.5, nudgeInterval = null;
    function onOpenCvReady() { cvReady = true; }

    document.getElementById('album-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            originalImg = new Image();
            originalImg.onload = () => {
                document.getElementById('upload-view').style.display = 'none';
                document.getElementById('editor-view').style.display = 'flex';
                document.getElementById('control-panel').style.display = 'flex';
                initCanvas();
            };
            originalImg.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    function initCanvas() {
        const canvas = document.getElementById('editor-canvas');
        const scale = Math.min(window.innerWidth/originalImg.width, (window.innerHeight*0.5)/originalImg.height);
        canvas.width = originalImg.width * scale; canvas.height = originalImg.height * scale;
        const s = canvas.width*0.1;
        points = [{x:s,y:s}, {x:canvas.width-s, y:s}, {x:canvas.width-s, y:canvas.height-s}, {x:s, y:canvas.height-s}];
        selectCorner(0);
        render();
    }

    function render() {
        const ctx = document.getElementById('editor-canvas').getContext('2d');
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.drawImage(originalImg, 0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.strokeStyle = '#00e676'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
        points.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath(); ctx.stroke();
        points.forEach((p, i) => {
            ctx.fillStyle = (i === activeIdx) ? '#ffea00' : '#ff1744';
            ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI*2); ctx.fill();
        });
    }

    function selectCorner(idx) { activeIdx = idx; document.querySelectorAll('.corner-btn').forEach((b,i)=>b.className='corner-btn'+(i===idx?' active':'')); render(); }
    function toggleStep() { stepSize = (stepSize === 0.5) ? 2.0 : 0.5; document.getElementById('step-btn').innerText = stepSize + "px"; }
    
    function startNudge(dx, dy) {
        clearInterval(nudgeInterval);
        nudgeInterval = setInterval(() => {
            points[activeIdx].x += dx * stepSize; points[activeIdx].y += dy * stepSize;
            render();
        }, 50);
    }
    function stopNudge() { clearInterval(nudgeInterval); }

    const canvas = document.getElementById('editor-canvas');
    canvas.addEventListener('pointermove', (e) => {
        if(e.buttons !== 1) return;
        const rect = canvas.getBoundingClientRect();
        points[activeIdx] = { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
        render();
    });

    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        points.forEach((p, i) => { if(Math.hypot(p.x-x, p.y-y) < 50) selectCorner(i); });
    });

    function getCleanCard() {
        const dstW = 1011, dstH = 638;
        const canvas = document.createElement('canvas'); canvas.width = dstW; canvas.height = dstH;
        const ctx = canvas.getContext('2d');
        const srcMat = cv.imread(originalImg);
        const dstMat = new cv.Mat();
        const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, points.flatMap(p => [p.x * (originalImg.width/canvas.width), p.y * (originalImg.height/canvas.height)]));
        const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0,0, dstW,0, dstW,dstH, 0,dstH]);
        const M = cv.getPerspectiveTransform(srcTri, dstTri);
        cv.warpPerspective(srcMat, dstMat, M, new cv.Size(dstW, dstH), cv.INTER_CUBIC);
        cv.imshow(canvas, dstMat);
        srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();
        
        const out = document.createElement('canvas'); out.width = dstW; out.height = dstH;
        const oCtx = out.getContext('2d');
        oCtx.fillStyle = '#fff'; oCtx.fillRect(0,0,dstW,dstH);
        oCtx.beginPath(); oCtx.roundRect(0,0,dstW,dstH, 36); oCtx.clip();
        oCtx.drawImage(canvas, 0, 0);
        return out;
    }

    function saveResult() {
        const card = getCleanCard();
        const a4 = document.createElement('canvas'); a4.width=2480; a4.height=3508;
        const ctx = a4.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,2480,3508);
        ctx.drawImage(card, (2480-1011)/2, 380, 1011, 638);
        const link = document.createElement('a');
        link.download = "신분증_A4.jpg"; link.href = a4.toDataURL("image/jpeg", 1.0); link.click();
        document.getElementById('toast').style.display = 'block';
        setTimeout(()=>document.getElementById('toast').style.display='none', 2000);
    }

    function printCard() {
        const card = getCleanCard();
        const win = window.open();
        win.document.write(`<img src="${card.toDataURL()}" style="width:85.6mm; height:53.98mm;">`);
        setTimeout(() => { win.print(); win.close(); }, 500);
    }
</script>
</body>
</html>

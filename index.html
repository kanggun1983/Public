<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 정밀 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
    body { font-family: sans-serif; background: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 45px; background: #111; display: flex; align-items: center; justify-content: center; font-weight: bold; border-bottom: 1px solid #333; flex-shrink: 0; }
    #main-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    #upload-view { width: 80%; height: 200px; border: 2px dashed #666; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; background: #1a1a1a; border-radius: 20px; }
    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; position: absolute; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    /* 확대경 */
    #loupe-container { position: absolute; top: 10px; right: 10px; width: 140px; height: 140px; border: 3px solid #00e676; border-radius: 10px; z-index: 50; display: none; overflow: hidden; background: #000; }
    #loupe-canvas { width: 100%; height: 100%; }

    /* 컨트롤 패널 */
    #control-panel { height: 280px; background: #181818; padding: 10px; border-top: 2px solid #333; display: none; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .row { display: flex; gap: 5px; justify-content: center; }
    .corner-btn { padding: 8px 12px; background: #333; border: 1px solid #555; color: #fff; border-radius: 5px; font-size: 13px; }
    .corner-btn.active { background: #00e676; color: #000; font-weight: bold; }
    .dpad-row { display: flex; gap: 15px; align-items: center; justify-content: center; }
    .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; gap: 5px; }
    .dpad button { background: #444; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; }
    .dpad button:active { background: #00e676; color: #000; }
    .btn { height: 45px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: #fff; flex: 1; }

    /* 인쇄 강제 규격 */
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; display: flex; justify-content: center; }
      #print-img { width: 85.6mm !important; height: 53.98mm !important; display: block !important; }
    }
  </style>
</head>
<body>
<header>신분증 정밀 스캐너</header>
<input type="file" id="album-input" accept="image/*" style="display: none;">

<div id="main-container">
    <div id="upload-view" onclick="document.getElementById('album-input').click()">🖼️ 갤러리에서 사진 선택</div>
    <div id="editor-view">
        <canvas id="editor-canvas"></canvas>
        <div id="loupe-container"><canvas id="loupe-canvas" width="140" height="140"></canvas></div>
    </div>
</div>

<div id="control-panel">
    <div class="row">
        <button class="corner-btn active" onclick="selectCorner(0)">┌ 좌상</button>
        <button class="corner-btn" onclick="selectCorner(1)">┐ 우상</button>
        <button class="corner-btn" onclick="selectCorner(2)">┘ 우하</button>
        <button class="corner-btn" onclick="selectCorner(3)">└ 좌하</button>
        <button id="step-btn" onclick="toggleStep()" style="width:50px; background:#ff9800; border-radius:5px; border:none; font-weight:bold;">0.5px</button>
    </div>
    <div class="dpad-row">
        <div class="dpad">
            <div></div><button onpointerdown="startNudge(0,-1)" onpointerup="stopNudge()">▲</button><div></div>
            <button onpointerdown="startNudge(-1,0)" onpointerup="stopNudge()">◀</button>
            <button onpointerdown="startNudge(0,1)" onpointerup="stopNudge()">▼</button>
            <button onpointerdown="startNudge(1,0)" onpointerup="stopNudge()">▶</button>
        </div>
        <div style="display:flex; flex-direction:column; gap:5px; flex:1;">
            <button class="btn" style="background:#9c27b0;" onclick="printCard()">🖨️ 실물크기 인쇄</button>
            <button class="btn" style="background:#00e676; color:#000;" onclick="saveResult()">💾 저장 (JPG)</button>
        </div>
    </div>
</div>

<div id="print-area" style="display:none;"><img id="print-img"></div>

<script>
    let cvReady = false, originalImg = null, points = [], activeIdx = 0, stepSize = 0.5, nudgeInterval = null;
    function onOpenCvReady() { cvReady = true; }

    document.getElementById('album-input').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            originalImg = new Image();
            originalImg.onload = () => {
                document.getElementById('upload-view').style.display = 'none';
                document.getElementById('editor-view').style.display = 'flex';
                document.getElementById('control-panel').style.display = 'flex';
                initCanvas();
            };
            originalImg.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function initCanvas() {
        const canvas = document.getElementById('editor-canvas');
        const scale = Math.min(window.innerWidth/originalImg.width, (window.innerHeight*0.5)/originalImg.height);
        canvas.width = originalImg.width * scale; canvas.height = originalImg.height * scale;
        const s = canvas.width*0.1;
        points = [{x:s,y:s}, {x:canvas.width-s, y:s}, {x:canvas.width-s, y:canvas.height-s}, {x:s, y:canvas.height-s}];
        render();
    }

    function render() {
        const ctx = document.getElementById('editor-canvas').getContext('2d');
        ctx.clearRect(0,0,ctx.canvas.width, ctx.canvas.height);
        ctx.drawImage(originalImg, 0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.strokeStyle = '#00e676'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
        points.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath(); ctx.stroke();
        points.forEach((p, i) => {
            ctx.fillStyle = (i === activeIdx) ? '#ffea00' : '#ff1744';
            ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI*2); ctx.fill();
        });
        updateLoupe();
    }

    function selectCorner(idx) { activeIdx = idx; document.querySelectorAll('.corner-btn').forEach((b,i)=>b.className='corner-btn'+(i===idx?' active':'')); render(); }
    function toggleStep() { stepSize = (stepSize === 0.5) ? 2.0 : 0.5; document.getElementById('step-btn').innerText = stepSize + "px"; }
    function startNudge(dx, dy) { clearInterval(nudgeInterval); nudgeInterval = setInterval(() => { points[activeIdx].x += dx * stepSize; points[activeIdx].y += dy * stepSize; render(); }, 50); }
    function stopNudge() { clearInterval(nudgeInterval); }

    function updateLoupe() {
        const lCtx = document.getElementById('loupe-canvas').getContext('2d');
        const p = points[activeIdx];
        const canvas = document.getElementById('editor-canvas');
        const sW = originalImg.width / canvas.width;
        const sH = originalImg.height / canvas.height;
        lCtx.drawImage(originalImg, p.x*sW-70, p.y*sH-70, 140, 140, 0, 0, 140, 140);
        document.getElementById('loupe-container').style.display = 'block';
    }

    const canvas = document.getElementById('editor-canvas');
    canvas.addEventListener('pointermove', (e) => { if(e.buttons === 1) { const r=canvas.getBoundingClientRect(); points[activeIdx] = {x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height)}; render(); } });
    canvas.addEventListener('pointerdown', (e) => { const r=canvas.getBoundingClientRect(); const x=(e.clientX-r.left)*(canvas.width/r.width), y=(e.clientY-r.top)*(canvas.height/r.height); points.forEach((p,i)=>{if(Math.hypot(p.x-x, p.y-y)<50) selectCorner(i);}); });

    function getCleanCard() {
        const dstW=1011, dstH=638;
        const canvas = document.createElement('canvas'); canvas.width=dstW; canvas.height=dstH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(originalImg, 0, 0, dstW, dstH); // 왜곡보정용 warp
        const out = document.createElement('canvas'); out.width=dstW; out.height=dstH;
        const oCtx = out.getContext('2d');
        oCtx.fillStyle='#fff'; oCtx.fillRect(0,0,dstW,dstH);
        oCtx.beginPath(); oCtx.roundRect(0,0,dstW,dstH, 36); oCtx.clip();
        oCtx.drawImage(canvas, 0, 0);
        return out;
    }

    function printCard() {
        document.getElementById('print-img').src = getCleanCard().toDataURL('image/jpeg', 1.0);
        window.print();
    }

    function saveResult() {
        const link = document.createElement('a');
        link.download = "신분증_스캔.jpg";
        link.href = getCleanCard().toDataURL("image/jpeg", 1.0);
        link.click();
    }
</script>
</body>
</html>

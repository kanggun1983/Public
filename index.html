<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>정밀 신분증 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
    body { font-family: -apple-system, sans-serif; background: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    #main-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* 돋보기 박스 */
    #loupe-container { position: absolute; bottom: 130px; right: 10px; width: 150px; height: 150px; border: 3px solid #ff1744; background: #000; z-index: 50; display: none; }
    #loupe-canvas { width: 100%; height: 100%; }
    
    /* 컨트롤러 패널 */
    #control-panel { height: 120px; background: #1e1e1e; display: flex; align-items: center; justify-content: space-around; padding: 10px; border-top: 1px solid #333; }
    .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; gap: 4px; }
    .dpad button { background: #333; border: 1px solid #555; color: white; border-radius: 8px; font-weight: bold; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .actions { display: flex; flex-direction: column; gap: 5px; width: 120px; }
    .btn { height: 45px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
    .btn-shoot { background: #2979ff; color: white; }
    .btn-warp { background: #00e676; color: black; }
    
    #result-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:200; }
    /* 핵심 수정: 결과 이미지가 잘리지 않게 설정 */
    #result-canvas { max-width: 95vw; max-height: 70vh; object-fit: contain; border: 2px solid #fff; }
  </style>
</head>
<body>

  <div id="main-container">
    <canvas id="editor-canvas"></canvas>
    <div id="loupe-container"><canvas id="loupe-canvas" width="150" height="150"></canvas></div>
  </div>

  <div id="control-panel">
    <div class="dpad">
      <div></div><button onclick="nudge(0,-1)">▲</button><div></div>
      <button onclick="nudge(-1,0)">◀</button><button onclick="nudge(0,1)">▼</button><button onclick="nudge(1,0)">▶</button>
    </div>
    <div class="actions">
      <input type="file" id="file-input" accept="image/*" style="display: none;">
      <button class="btn btn-shoot" onclick="document.getElementById('file-input').click()">📷 사진/앨범</button>
      <button class="btn btn-warp" id="btn-scan" onclick="processScan()">완료</button>
    </div>
  </div>

  <div id="result-modal">
    <canvas id="result-canvas"></canvas>
    <button class="btn btn-shoot" style="margin-top:20px; width:200px" onclick="document.getElementById('result-modal').style.display='none'">닫기</button>
  </div>

  <script>
    let cvReady = false, originalImg = null, points = [], activeIdx = -1, scaleX = 1, scaleY = 1;
    function onOpenCvReady() { cvReady = true; }

    const editorCanvas = document.getElementById('editor-canvas'), ctx = editorCanvas.getContext('2d');
    const loupe = document.getElementById('loupe-container'), loupeCanvas = document.getElementById('loupe-canvas');
    const lCtx = loupeCanvas.getContext('2d');

    document.getElementById('file-input').onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        originalImg = new Image();
        originalImg.onload = () => {
          const container = document.getElementById('main-container');
          const scale = Math.min(container.clientWidth / originalImg.width, container.clientHeight / originalImg.height);
          editorCanvas.width = originalImg.width * scale;
          editorCanvas.height = originalImg.height * scale;
          scaleX = originalImg.width / editorCanvas.width;
          scaleY = originalImg.height / editorCanvas.height;
          const w = editorCanvas.width, h = editorCanvas.height;
          points = [{x: w*0.2, y: h*0.25}, {x: w*0.8, y: h*0.25}, {x: w*0.8, y: h*0.75}, {x: w*0.2, y: h*0.75}];
          render();
        };
        originalImg.src = event.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    };

    function render() {
      ctx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
      ctx.drawImage(originalImg, 0, 0, editorCanvas.width, editorCanvas.height);
      ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.strokeStyle = '#00e676'; ctx.lineWidth = 3; ctx.stroke();
      points.forEach((p, i) => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 30, 0, Math.PI * 2);
        ctx.fillStyle = (activeIdx === i) ? '#ffea00' : '#ff1744';
        ctx.fill();
      });
      if(activeIdx !== -1) updateLoupe();
    }

    function updateLoupe() {
      loupe.style.display = 'block';
      const p = points[activeIdx];
      lCtx.clearRect(0,0,150,150);
      lCtx.drawImage(originalImg, (p.x * scaleX) - 40, (p.y * scaleY) - 40, 80, 80, 0, 0, 150, 150);
      lCtx.strokeStyle = 'red'; lCtx.strokeRect(65, 65, 20, 20);
    }

    function nudge(dx, dy) {
      if(activeIdx === -1) return;
      points[activeIdx].x += dx; points[activeIdx].y += dy;
      render();
    }

    const handleInput = (e) => {
      const rect = editorCanvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      activeIdx = points.findIndex(p => Math.hypot(p.x - x, p.y - y) < 60);
      render();
    };

    const handleDrag = (e) => {
      if(activeIdx === -1) return;
      e.preventDefault();
      const rect = editorCanvas.getBoundingClientRect();
      points[activeIdx].x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      points[activeIdx].y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      render();
    };

    editorCanvas.addEventListener('mousedown', handleInput);
    editorCanvas.addEventListener('touchstart', handleInput);
    editorCanvas.addEventListener('mousemove', handleDrag);
    editorCanvas.addEventListener('touchmove', handleDrag, {passive:false});

    function processScan() {
      if(!cvReady || !originalImg) return;
      const dstW = 1011, dstH = 638;
      const srcMat = cv.imread(originalImg);
      const dstMat = new cv.Mat();
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, points.flatMap(p => [p.x * scaleX, p.y * scaleY]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dstW, 0, dstW, dstH, 0, dstH]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      cv.warpPerspective(srcMat, dstMat, M, new cv.Size(dstW, dstH), cv.INTER_LINEAR);
      
      const resC = document.getElementById('result-canvas');
      cv.imshow(resC, dstMat);
      
      document.getElementById('result-modal').style.display = 'flex';
      srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();
    }
  </script>
</body>
</html>

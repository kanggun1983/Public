<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>고화질 신분증 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 44px; background: #181818; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2c2c2c; z-index: 20; }
    header h1 { font-size: 15px; font-weight: 600; }
    #toggle-auto { background: #333; color: #00e676; border: 1px solid #00e676; border-radius: 20px; font-size: 11px; font-weight: bold; padding: 4px 10px; cursor: pointer; }
    #toggle-auto.off { color: #888; border-color: #555; background: #222; }

    #main-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
    
    /* 카메라 화면 */
    #camera-view { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    
    #guide-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #guide-box {
      width: 86vw; max-width: 360px; aspect-ratio: 1.586 / 1;
      border: 3.5px solid #00e676; border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      position: relative; transition: border-color 0.2s;
    }
    #guide-box.detecting { border-color: #ffea00; }
    #guide-box.captured { border-color: #ffffff; box-shadow: 0 0 0 9999px rgba(255, 255, 255, 0.85); }
    #guide-msg {
      margin-top: 20px; font-size: 13px; color: #00e676;
      background: rgba(0,0,0,0.8); padding: 5px 14px; border-radius: 20px;
      font-weight: 500; text-align: center;
    }

    /* 편집 화면 */
    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; position: absolute; top:0; left:0; background: #0d0d0d; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; }

    /* 확대경 */
    #loupe-container { 
      position: absolute; width: 135px; height: 135px; 
      border: 2.5px solid #00e676; border-radius: 10px; background: #181818; 
      z-index: 50; display: none; pointer-events: none; overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.9);
      transition: top 0.2s, bottom 0.2s;
    }
    #loupe-canvas { width: 100%; height: 100%; }
    #loupe-label { position: absolute; top: 4px; left: 6px; font-size: 11px; font-weight: bold; color: #00e676; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 4px; z-index: 10; }

    /* 하단 조작 패널 */
    #control-panel { background: #181818; display: flex; flex-direction: column; padding: 8px 10px; border-top: 1px solid #2c2c2c; z-index: 30; gap: 8px; }
    
    #corner-selector { display: none; justify-content: space-between; gap: 5px; width: 100%; max-width: 360px; margin: 0 auto; }
    .corner-btn { flex: 1; height: 32px; background: #262626; color: #bbb; border: 1px solid #444; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .corner-btn.active { background: #00e676; color: #000; border-color: #00e676; }

    #panel-main { display: flex; align-items: center; justify-content: space-around; width: 100%; max-width: 360px; margin: 0 auto; }

    .dpad { display: none; grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px; gap: 3px; }
    .dpad button { background: #2e2e2e; color: white; border: 1px solid #444; border-radius: 8px; font-size: 17px; font-weight: bold; touch-action: manipulation; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .actions { display: flex; flex-direction: column; gap: 6px; flex: 1; margin-left: 10px; }
    .btn-row { display: flex; gap: 6px; width: 100%; }
    .btn { 
      height: 44px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; 
      cursor: pointer; display: flex; align-items: center; justify-content: center; 
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .btn-camera { background: #00e676; color: black; font-size: 15px; font-weight: bold; }
    .btn-album { background: #37474f; color: white; }
    .btn-warp { background: #00e676; color: black; font-size: 14px; font-weight: bold; }
    .btn-print { background: #9c27b0; color: white; }

    #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,230,118,0.95); color: #000; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 9999; display: none; }

    /* A4 실제 규격(85.6mm x 53.98mm) 1:1 실물 인쇄 전용 CSS */
    #print-area { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; width: 210mm; height: 297mm; }
      body > * { display: none !important; }
      #print-area {
        display: block !important;
        position: absolute !important;
        top: 25mm !important;
        left: 62.2mm !important; /* 가로 정중앙: (210mm - 85.6mm) / 2 */
        width: 85.6mm !important;
        height: 53.98mm !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #print-area img {
        width: 85.6mm !important;
        height: 53.98mm !important;
        display: block !important;
        object-fit: fill !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>신분증 스마트 스캐너</h1>
    <button id="toggle-auto" onclick="toggleAutoMode()">⚡ 자동촬영 ON</button>
  </header>

  <div id="toast">저장 완료!</div>

  <div id="main-container">
    <div id="camera-view">
      <video id="video" autoplay playsinline muted></video>
      <div id="guide-overlay">
        <div id="guide-box"></div>
        <div id="guide-msg">신분증을 초록 사각형에 맞춰주세요</div>
      </div>
    </div>

    <div id="editor-view">
      <canvas id="editor-canvas"></canvas>
      <div id="loupe-container">
        <span id="loupe-label">모서리</span>
        <canvas id="loupe-canvas" width="135" height="135"></canvas>
      </div>
    </div>
  </div>

  <div id="control-panel">
    <div id="corner-selector">
      <button class="corner-btn active" onclick="selectCorner(0)">┌ 좌상</button>
      <button class="corner-btn" onclick="selectCorner(1)">┐ 우상</button>
      <button class="corner-btn" onclick="selectCorner(2)">┘ 우하</button>
      <button class="corner-btn" onclick="selectCorner(3)">└ 좌하</button>
    </div>

    <div id="panel-main">
      <div class="dpad" id="dpad-box">
        <div></div><button onclick="nudge(0,-3)">▲</button><div></div>
        <button onclick="nudge(-3,0)">◀</button><button onclick="nudge(0,3)">▼</button><button onclick="nudge(3,0)">▶</button>
      </div>

      <div class="actions">
        <input type="file" id="album-input" accept="image/*" style="display: none;">
        
        <div class="btn-row" id="cam-actions">
          <button class="btn btn-album" style="flex: 1;" onclick="document.getElementById('album-input').click()">🖼️ 앨범</button>
          <button class="btn btn-camera" style="flex: 2;" onclick="triggerCapture()">📸 사진 촬영</button>
        </div>

        <div class="btn-row" id="edit-actions" style="display: none;">
          <button class="btn btn-album" style="flex: 0.8;" onclick="backToCamera()">📷 재촬영</button>
          <button class="btn btn-print" style="flex: 1;" onclick="printA4()">🖨️ A4 인쇄</button>
          <button class="btn btn-warp" style="flex: 1.4;" onclick="saveA4Document()">💾 저장(JPG)</button>
        </div>
      </div>
    </div>
  </div>

  <div id="print-area"><img id="print-img" alt="신분증 인쇄"></div>

  <script>
    let cvReady = false, stream = null, imageTrack = null, imageCapture = null;
    let originalImg = null, points = [], activeIdx = 0, scaleX = 1, scaleY = 1;
    let autoScanInterval = null, autoModeEnabled = true, stabilityCount = 0, isCapturing = false;
    const cornerNames = ["좌상단 ┌", "우상단 ┐", "우하단 ┘", "좌하단 └"];

    function onOpenCvReady() { cvReady = true; }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    function toggleAutoMode() {
      autoModeEnabled = !autoModeEnabled;
      const btn = document.getElementById('toggle-auto');
      if (autoModeEnabled) {
        btn.innerText = "⚡ 자동촬영 ON";
        btn.classList.remove('off');
      } else {
        btn.innerText = "🖐️ 수동촬영 모드";
        btn.classList.add('off');
        document.getElementById('guide-msg').innerText = "신분증을 맞추고 [📸 사진 촬영]을 누르세요";
      }
      stabilityCount = 0;
    }

    // 4K/FHD 최고 화질 카메라 연결 (플래시 비활성화)
    async function startCamera() {
      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" }, 
            width: { ideal: 3840, min: 1920 }, 
            height: { ideal: 2160, min: 1080 },
            advanced: [{ torch: false }]
          },
          audio: false
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        imageTrack = stream.getVideoTracks()[0];
        if (window.ImageCapture && imageTrack) {
          imageCapture = new ImageCapture(imageTrack);
        }
        video.onloadedmetadata = () => {
          video.play();
          startAutoDetection();
        };
      } catch (err) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } },
            audio: false
          });
          document.getElementById('video').srcObject = stream;
          startAutoDetection();
        } catch(e) {
          alert("카메라 권한을 허용해주세요.");
        }
      }
    }
    window.addEventListener('load', startCamera);

    // 자동 감지 루프
    function startAutoDetection() {
      if (autoScanInterval) clearInterval(autoScanInterval);
      const testCanvas = document.createElement('canvas');
      const tCtx = testCanvas.getContext('2d', { willReadFrequently: true });
      testCanvas.width = 160;
      testCanvas.height = 100;

      autoScanInterval = setInterval(() => {
        if (!autoModeEnabled || isCapturing || document.getElementById('camera-view').style.display === 'none') return;
        const video = document.getElementById('video');
        if (!video.videoWidth || video.readyState < 2) return;

        const vRect = video.getBoundingClientRect();
        const gRect = document.getElementById('guide-box').getBoundingClientRect();
        const scale = Math.max(video.videoWidth / vRect.width, video.videoHeight / vRect.height);
        const offsetX = (vRect.width - (video.videoWidth / scale)) / 2;
        const offsetY = (vRect.height - (video.videoHeight / scale)) / 2;

        const cropX = (gRect.left - vRect.left - offsetX) * scale;
        const cropY = (gRect.top - vRect.top - offsetY) * scale;
        const cropW = gRect.width * scale;
        const cropH = gRect.height * scale;

        tCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 160, 100);
        const imgData = tCtx.getImageData(0, 0, 160, 100);
        const d = imgData.data;

        let edgeScore = 0;
        for (let y = 1; y < 99; y += 2) {
          for (let x = 1; x < 159; x += 2) {
            let idx = (y * 160 + x) * 4;
            let val = (d[idx] + d[idx+1] + d[idx+2]) / 3;
            let valRight = (d[idx+4] + d[idx+5] + d[idx+6]) / 3;
            let valDown = (d[idx+640] + d[idx+641] + d[idx+642]) / 3;
            edgeScore += Math.abs(val - valRight) + Math.abs(val - valDown);
          }
        }
        edgeScore = edgeScore / (80 * 50);

        const gBox = document.getElementById('guide-box');
        const gMsg = document.getElementById('guide-msg');

        if (edgeScore > 18.0) {
          stabilityCount++;
          gBox.classList.add('detecting');
          gMsg.innerText = `신분증 감지됨! 움직이지 마세요 (${stabilityCount}/4)`;
          gMsg.style.color = '#ffea00';

          if (stabilityCount >= 4) {
            triggerCapture();
          }
        } else {
          stabilityCount = 0;
          gBox.classList.remove('detecting');
          gMsg.innerText = "신분증을 초록 사각형에 맞춰주세요";
          gMsg.style.color = '#00e676';
        }
      }, 250);
    }

    function triggerCapture() {
      if (isCapturing) return;
      isCapturing = true;

      const gBox = document.getElementById('guide-box');
      gBox.classList.add('captured');
      if (navigator.vibrate) navigator.vibrate(60);

      setTimeout(() => {
        gBox.classList.remove('captured', 'detecting');
        captureToEditor();
      }, 100);
    }

    // 초고화소 센서 원본 캡처 (선명도 극대화)
    async function captureToEditor() {
      const video = document.getElementById('video');
      let capturedCanvas = null;

      if (imageCapture) {
        try {
          const blob = await imageCapture.takePhoto();
          const imgBitmap = await createImageBitmap(blob);
          const memCanvas = document.createElement('canvas');
          memCanvas.width = imgBitmap.width;
          memCanvas.height = imgBitmap.height;
          memCanvas.getContext('2d').drawImage(imgBitmap, 0, 0);
          capturedCanvas = memCanvas;
        } catch(e) {
          capturedCanvas = null;
        }
      }

      if (!capturedCanvas) {
        const memCanvas = document.createElement('canvas');
        memCanvas.width = video.videoWidth;
        memCanvas.height = video.videoHeight;
        memCanvas.getContext('2d').drawImage(video, 0, 0);
        capturedCanvas = memCanvas;
      }

      originalImg = capturedCanvas;
      openEditorView();
    }

    document.getElementById('album-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const tempImg = new Image();
        tempImg.onload = () => {
          originalImg = tempImg;
          openEditorView();
        };
        tempImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    };

    function openEditorView() {
      document.getElementById('camera-view').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('cam-actions').style.display = 'none';
      document.getElementById('edit-actions').style.display = 'flex';
      document.getElementById('dpad-box').style.display = 'grid';
      document.getElementById('corner-selector').style.display = 'flex';

      const container = document.getElementById('main-container');
      const scale = Math.min(container.clientWidth / originalImg.width, container.clientHeight / originalImg.height);
      const canvas = document.getElementById('editor-canvas');
      canvas.width = Math.round(originalImg.width * scale);
      canvas.height = Math.round(originalImg.height * scale);
      scaleX = originalImg.width / canvas.width;
      scaleY = originalImg.height / canvas.height;

      const w = canvas.width, h = canvas.height;
      const cardW = Math.min(w * 0.76, h * 0.76 * 1.586);
      const cardH = cardW / 1.586;
      const sx = (w - cardW) / 2;
      const sy = (h - cardH) / 2;

      points = [
        { x: sx, y: sy },
        { x: sx + cardW, y: sy },
        { x: sx + cardW, y: sy + cardH },
        { x: sx, y: sy + cardH }
      ];

      selectCorner(0);
    }

    function selectCorner(idx) {
      activeIdx = idx;
      const btns = document.querySelectorAll('.corner-btn');
      btns.forEach((b, i) => {
        if (i === idx) b.classList.add('active');
        else b.classList.remove('active');
      });
      render();
    }

    function backToCamera() {
      document.getElementById('editor-view').style.display = 'none';
      document.getElementById('camera-view').style.display = 'flex';
      document.getElementById('edit-actions').style.display = 'none';
      document.getElementById('cam-actions').style.display = 'flex';
      document.getElementById('dpad-box').style.display = 'none';
      document.getElementById('corner-selector').style.display = 'none';
      isCapturing = false;
      stabilityCount = 0;
      startCamera();
    }

    function render() {
      const canvas = document.getElementById('editor-canvas');
      if (!canvas || !originalImg) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 230, 118, 0.18)';
      ctx.fill();
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 3;
      ctx.stroke();

      points.forEach((p, i) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
        ctx.fillStyle = (activeIdx === i) ? '#ffea00' : '#ff1744';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      });

      updateLoupe();
    }

    function updateLoupe() {
      const loupe = document.getElementById('loupe-container');
      const lCanvas = document.getElementById('loupe-canvas');
      const lCtx = lCanvas.getContext('2d');
      const canvas = document.getElementById('editor-canvas');
      document.getElementById('loupe-label').innerText = cornerNames[activeIdx];
      loupe.style.display = 'block';

      const p = points[activeIdx];

      if (p.y > canvas.height * 0.45 && p.x > canvas.width * 0.45) {
        loupe.style.top = '12px';
        loupe.style.bottom = 'auto';
        loupe.style.right = '12px';
      } else {
        loupe.style.bottom = '12px';
        loupe.style.top = 'auto';
        loupe.style.right = '12px';
      }

      const cx = 67, cy = 67;
      const viewSize = 52;
      const cropW = viewSize * scaleX, cropH = viewSize * scaleY;
      const cropX = (p.x * scaleX) - (cropW / 2), cropY = (p.y * scaleY) - (cropH / 2);

      lCtx.fillStyle = '#181818';
      lCtx.fillRect(0, 0, 135, 135);
      try {
        lCtx.drawImage(originalImg, cropX, cropY, cropW, cropH, 0, 0, 135, 135);
      } catch(e){}

      lCtx.save();
      lCtx.lineWidth = 3.5;
      lCtx.strokeStyle = '#ff1744';
      lCtx.beginPath();
      const arm = 30;
      if (activeIdx === 0) { lCtx.moveTo(cx + arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy + arm); }
      else if (activeIdx === 1) { lCtx.moveTo(cx - arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy + arm); }
      else if (activeIdx === 2) { lCtx.moveTo(cx - arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy - arm); }
      else if (activeIdx === 3) { lCtx.moveTo(cx + arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy - arm); }
      lCtx.stroke();
      lCtx.fillStyle = '#ffea00';
      lCtx.beginPath(); lCtx.arc(cx, cy, 3, 0, Math.PI * 2); lCtx.fill();
      lCtx.restore();
    }

    function nudge(dx, dy) {
      if (activeIdx === -1) return;
      const canvas = document.getElementById('editor-canvas');
      points[activeIdx].x = Math.max(0, Math.min(canvas.width, points[activeIdx].x + dx));
      points[activeIdx].y = Math.max(0, Math.min(canvas.height, points[activeIdx].y + dy));
      render();
    }

    const canvas = document.getElementById('editor-canvas');
    function getCanvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function handleTouch(e) {
      const pt = getCanvasPoint(e);
      let minDist = Infinity;
      let targetIdx = 0;
      points.forEach((p, i) => {
        const dist = Math.hypot(p.x - pt.x, p.y - pt.y);
        if (dist < minDist) { minDist = dist; targetIdx = i; }
      });
      selectCorner(targetIdx);
    }

    function handleDrag(e) {
      if (activeIdx === -1) return;
      e.preventDefault();
      const pt = getCanvasPoint(e);
      points[activeIdx].x = Math.max(0, Math.min(canvas.width, pt.x));
      points[activeIdx].y = Math.max(0, Math.min(canvas.height, pt.y));
      render();
    }

    canvas.addEventListener('mousedown', handleTouch);
    canvas.addEventListener('touchstart', handleTouch);
    canvas.addEventListener('mousemove', handleDrag);
    canvas.addEventListener('touchmove', handleDrag, {passive:false});

    // 300 DPI 초고화질 왜곡 보정 및 선명화 (Unsharp Masking)
    function getCleanCardCanvas() {
      const dstW = 1011, dstH = 638; // 300 DPI 실물 규격
      const rawCanvas = document.createElement('canvas');
      rawCanvas.width = dstW; rawCanvas.height = dstH;

      const srcMat = cv.imread(originalImg);
      const dstMat = new cv.Mat();
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, points.flatMap(p => [p.x * scaleX, p.y * scaleY]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dstW, 0, dstW, dstH, 0, dstH]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      
      // 고화질 CUBIC 보간
      cv.warpPerspective(srcMat, dstMat, M, new cv.Size(dstW, dstH), cv.INTER_CUBIC);

      // 글자 및 디테일 선명화 필터
      const blurred = new cv.Mat();
      cv.GaussianBlur(dstMat, blurred, new cv.Size(0, 0), 2.2);
      cv.addWeighted(dstMat, 1.4, blurred, -0.4, 0, dstMat);
      blurred.delete();

      cv.imshow(rawCanvas, dstMat);

      srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();

      const outCanvas = document.createElement('canvas');
      outCanvas.width = dstW; outCanvas.height = dstH;
      const oCtx = outCanvas.getContext('2d');

      oCtx.save();
      oCtx.beginPath();
      oCtx.roundRect(0, 0, dstW, dstH, 36);
      oCtx.clip();
      oCtx.drawImage(rawCanvas, 0, 0);
      oCtx.restore();

      return outCanvas;
    }

    // A4 규격(300 DPI) 순백색(#FFFFFF) 스캔 문서 생성
    function getA4DocumentCanvas() {
      const cardCanvas = getCleanCardCanvas();
      const a4Canvas = document.createElement('canvas');
      a4Canvas.width = 2480;
      a4Canvas.height = 3508;
      const a4Ctx = a4Canvas.getContext('2d');

      a4Ctx.fillStyle = '#ffffff';
      a4Ctx.fillRect(0, 0, 2480, 3508);

      const posX = Math.round((2480 - 1011) / 2);
      const posY = 350; // 상단 여백 배치

      a4Ctx.drawImage(cardCanvas, posX, posY, 1011, 638);
      return a4Canvas;
    }

    // [💾 저장(JPG)]
    async function saveA4Document() {
      if (!cvReady || !originalImg) return;
      const a4Canvas = getA4DocumentCanvas();
      const filename = `신분증_A4스캔본_${Date.now()}.jpg`;

      a4Canvas.toBlob(async (blob) => {
        if (!blob) return alert("이미지 생성 실패");
        const file = new File([blob], filename, { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: '신분증 A4 스캔본' });
            showToast("A4 스캔본 저장 완료!");
            backToCamera();
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);

        showToast("A4 스캔본 저장 완료!");
        backToCamera();
      }, 'image/jpeg', 0.95);
    }

    // [🖨️ A4 1:1 실물 크기 인쇄]
    function printA4() {
      if (!cvReady || !originalImg) return;
      // 실물 카드 이미지를 CSS 85.6mm x 53.98mm로 직접 인쇄하여 오차 제거
      const cardCanvas = getCleanCardCanvas();
      const dataUrl = cardCanvas.toDataURL('image/jpeg', 1.0);
      const pImg = document.getElementById('print-img');
      pImg.src = dataUrl;
      pImg.onload = () => {
        window.print();
      };
    }
  </script>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 정밀 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #fff; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    header { height: 50px; background: #1e1e1e; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333; }
    header h1 { font-size: 16px; font-weight: 600; }
    #status { font-size: 12px; color: #ff9800; }
    
    /* 메인 캔버스 */
    #main-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
    #editor-canvas { max-width: 100%; max-height: 100%; touch-action: none; }
    
    /* D-PAD 컨트롤러 */
    #control-panel { height: 120px; background: #1e1e1e; display: flex; align-items: center; justify-content: space-around; padding: 10px; border-top: 1px solid #333; }
    .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; gap: 5px; }
    .dpad button { background: #444; border: none; color: white; border-radius: 8px; font-size: 18px; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .actions { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .btn { height: 45px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-shoot { background: #2979ff; color: white; }
    .btn-warp { background: #00e676; color: black; }
    .btn-disabled { opacity: 0.3; pointer-events: none; }

    #loupe { position: absolute; width: 120px; height: 120px; border: 3px solid #00e676; border-radius: 50%; pointer-events: none; display: none; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 100; }
    #loupe-canvas { width: 100%; height: 100%; }
    
    #result-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
    #result-canvas { max-width: 95%; max-height: 70%; border-radius: 8px; }
    .modal-actions { margin-top: 20px; display: flex; gap: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>정밀 스캐너</h1>
    <span id="status">로딩 중...</span>
  </header>

  <div id="main-container">
    <canvas id="editor-canvas"></canvas>
    <div id="loupe"><canvas id="loupe-canvas" width="120" height="120"></canvas></div>
  </div>

  <!-- 컨트롤 패널 -->
  <div id="control-panel">
    <div class="dpad">
      <div></div><button onclick="nudge(0, -2)">▲</button><div></div>
      <button onclick="nudge(-2, 0)">◀</button><button onclick="nudge(0, 2)">▼</button><button onclick="nudge(2, 0)">▶</button>
    </div>
    <div class="actions">
      <input type="file" id="file-input" accept="image/*" style="display: none;">
      <button class="btn btn-shoot" onclick="document.getElementById('file-input').click()">📷 사진/갤러리</button>
      <button class="btn btn-warp btn-disabled" id="btn-scan">이대로 펴기</button>
    </div>
  </div>

  <div id="result-modal">
    <canvas id="result-canvas"></canvas>
    <div class="modal-actions">
      <button class="btn btn-shoot" onclick="resultModal.style.display='none'">수정</button>
      <button class="btn btn-warp" id="btn-download">저장(JPG)</button>
    </div>
  </div>

  <script>
    let cvReady = false, originalImg = null, points = [], activeIdx = -1;
    function onOpenCvReady() { cvReady = true; document.getElementById('status').innerText = "준비 완료"; document.getElementById('status').style.color = "#00e676"; }

    const editorCanvas = document.getElementById('editor-canvas'), ctx = editorCanvas.getContext('2d');
    const resultModal = document.getElementById('result-modal'), resultCanvas = document.getElementById('result-canvas');
    const btnScan = document.getElementById('btn-scan');

    document.getElementById('file-input').onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        originalImg = new Image();
        originalImg.onload = () => { setupCanvas(); btnScan.classList.remove('btn-disabled'); };
        originalImg.src = event.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    };

    function setupCanvas() {
      const container = document.getElementById('main-container');
      const scale = Math.min(container.clientWidth / originalImg.width, container.clientHeight / originalImg.height);
      editorCanvas.width = originalImg.width * scale;
      editorCanvas.height = originalImg.height * scale;
      const w = editorCanvas.width, h = editorCanvas.height;
      points = [{x: w*0.2, y: h*0.25}, {x: w*0.8, y: h*0.25}, {x: w*0.8, y: h*0.75}, {x: w*0.2, y: h*0.75}];
      render();
    }

    function render() {
      ctx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
      ctx.drawImage(originalImg, 0, 0, editorCanvas.width, editorCanvas.height);
      ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 230, 118, 0.2)'; ctx.fill();
      ctx.strokeStyle = '#00e676'; ctx.lineWidth = 3; ctx.stroke();
      points.forEach((p, i) => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = (activeIdx === i) ? '#ffea00' : '#ff1744';
        ctx.fill();
      });
    }

    function nudge(dx, dy) {
      if (activeIdx === -1) return;
      points[activeIdx].x = Math.max(0, Math.min(editorCanvas.width, points[activeIdx].x + dx));
      points[activeIdx].y = Math.max(0, Math.min(editorCanvas.height, points[activeIdx].y + dy));
      render();
    }

    // 터치/클릭 선택 로직
    const handleAction = (e) => {
      const rect = editorCanvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      activeIdx = points.findIndex(p => Math.hypot(p.x - x, p.y - y) < 40);
      render();
    };

    editorCanvas.addEventListener('mousedown', handleAction);
    editorCanvas.addEventListener('touchstart', handleAction);

    btnScan.onclick = () => {
      if (!cvReady) return;
      const dstW = 1011, dstH = 638; // 300 DPI 기준 실물 크기
      const sx = originalImg.width / editorCanvas.width, sy = originalImg.height / editorCanvas.height;
      const srcMat = cv.imread(originalImg);
      const dstMat = new cv.Mat();
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, points.flatMap(p => [p.x * sx, p.y * sy]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dstW, 0, dstW, dstH, 0, dstH]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      cv.warpPerspective(srcMat, dstMat, M, new cv.Size(dstW, dstH), cv.INTER_LINEAR);
      resultCanvas.width = dstW; resultCanvas.height = dstH;
      cv.imshow(resultCanvas, dstMat);
      srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();
      resultModal.style.display = 'flex';
    };

    document.getElementById('btn-download').onclick = () => {
      const link = document.createElement('a');
      link.download = `ID_SCAN_${Date.now()}.jpg`;
      link.href = resultCanvas.toDataURL('image/jpeg', 0.95);
      link.click();
    };
  </script>
</body>
</html>

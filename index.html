<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 정밀 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d0d0d; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 44px; background: #181818; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid #2c2c2c; z-index: 20; flex-shrink: 0; }
    header h1 { font-size: 15px; font-weight: 600; }
    #status-badge { font-size: 11px; font-weight: bold; color: #00e676; background: #1a3320; padding: 4px 8px; border-radius: 12px; border: 1px solid #00e676; display: flex; align-items: center; gap: 3px; }

    #main-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
    
    #upload-view {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; width: 85%; max-width: 340px; padding: 36px 20px;
      border: 2px dashed #444; border-radius: 16px; background: #141414; text-align: center; cursor: pointer;
    }
    #upload-view:active { border-color: #00e676; background: #1a1a1a; }
    .upload-icon { font-size: 48px; }
    .upload-title { font-size: 16px; font-weight: bold; color: #fff; }
    .upload-desc { font-size: 12px; color: #888; line-height: 1.5; }

    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; }

    /* 보정(필터) 미리보기 뷰 */
    #preview-view { width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; padding: 20px; background: #0d0d0d; }
    #preview-canvas { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,230,118,0.15); }

    #loupe-container { 
      position: absolute; width: 140px; height: 140px; 
      border: 2.5px solid #00e676; border-radius: 12px; background: #181818; 
      z-index: 50; display: none; pointer-events: none; overflow: hidden;
      box-shadow: 0 6px 22px rgba(0,0,0,0.95);
      transition: top 0.2s, bottom 0.2s;
    }
    #loupe-canvas { width: 100%; height: 100%; }
    #loupe-label { position: absolute; top: 4px; left: 6px; font-size: 11px; font-weight: bold; color: #00e676; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; z-index: 10; }

    .bottom-panel { background: #181818; display: none; flex-direction: column; padding: 10px 14px 20px; border-top: 1px solid #2c2c2c; z-index: 30; gap: 10px; flex-shrink: 0; }
    
    #corner-selector { display: flex; align-items: center; justify-content: space-between; gap: 4px; width: 100%; max-width: 380px; margin: 0 auto; }
    .corner-btn { flex: 1; height: 32px; background: #262626; color: #bbb; border: 1px solid #444; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .corner-btn.active { background: #00e676; color: #000; border-color: #00e676; }
    #step-btn { width: 55px; height: 32px; background: #ff9800; color: #000; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }

    .panel-main { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 380px; margin: 0 auto; gap: 10px; }

    .dpad { display: grid; grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px; gap: 3px; }
    .dpad button { background: #2e2e2e; color: white; border: 1px solid #444; border-radius: 8px; font-size: 17px; font-weight: bold; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .actions { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .btn-row { display: flex; gap: 6px; width: 100%; max-width: 380px; margin: 0 auto; }
    .btn { 
      height: 44px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; 
      cursor: pointer; display: flex; align-items: center; justify-content: center; 
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; padding: 0 10px;
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .btn-album { background: #37474f; color: white; }
    .btn-warp { background: #00e676; color: black; font-size: 14px; font-weight: bold; }
    .btn-print { background: #9c27b0; color: white; }

    /* 슬라이더(필터) 스타일 */
    .slider-group { background: #222; padding: 12px 14px; border-radius: 10px; width: 100%; max-width: 380px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; border: 1px solid #333; }
    .slider-row { display: flex; align-items: center; font-size: 12px; color: #ddd; font-weight: 600; }
    .slider-row span.label { width: 40px; }
    .slider-row span.val-text { width: 35px; text-align: right; color: #00e676; }
    .slider-row input[type=range] { flex: 1; margin: 0 12px; accent-color: #00e676; }

    #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,230,118,0.95); color: #000; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 9999; display: none; }

    /* ★ 실제 물리 규격 85.6mm x 53.98mm 강제 인쇄 ★ */
    #print-area { display: none; }
    @media print {
      @page { size: auto; margin: 0mm; }
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute; left: 0; top: 0; width: 100%;
        display: flex; justify-content: center; padding-top: 10mm;
      }
      #print-img {
        width: 85.6mm !important;
        height: 53.98mm !important;
        display: block !important;
        border: none !important;
        outline: none !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>신분증 정밀 스캐너</h1>
    <span id="status-badge">🔒 로컬 기기 내 처리</span>
  </header>

  <div id="toast">알림</div>

  <input type="file" id="album-input" accept="image/*" style="display: none;">

  <!-- 메인 뷰 컨테이너 -->
  <div id="main-container">
    <!-- 0. 업로드 뷰 -->
    <div id="upload-view" onclick="document.getElementById('album-input').click()">
      <div class="upload-icon">🖼️</div>
      <div class="upload-title">갤러리에서 사진 선택</div>
      <div class="upload-desc">스캔할 신분증 사진을 불러오면<br>자동으로 정밀 편집 화면이 열립니다.</div>
    </div>

    <!-- 1. 정밀 에디터 뷰 (D-Pad용) -->
    <div id="editor-view">
      <canvas id="editor-canvas"></canvas>
      <div id="loupe-container">
        <span id="loupe-label">모서리</span>
        <canvas id="loupe-canvas" width="140" height="140"></canvas>
      </div>
    </div>

    <!-- 2. 필터 보정 미리보기 뷰 -->
    <div id="preview-view">
      <canvas id="preview-canvas"></canvas>
    </div>
  </div>

  <!-- 하단 컨트롤 패널 1: 정밀 자르기 (D-Pad) -->
  <div id="crop-panel" class="bottom-panel">
    <div id="corner-selector">
      <button class="corner-btn active" onclick="selectCorner(0)">┌ 좌상</button>
      <button class="corner-btn" onclick="selectCorner(1)">┐ 우상</button>
      <button class="corner-btn" onclick="selectCorner(2)">┘ 우하</button>
      <button class="corner-btn" onclick="selectCorner(3)">└ 좌하</button>
      <button id="step-btn" onclick="toggleStep()">0.5px</button>
    </div>

    <div class="panel-main">
      <div class="dpad" id="dpad-box">
        <div></div><button id="btn-up">▲</button><div></div>
        <button id="btn-left">◀</button><button id="btn-down">▼</button><button id="btn-right">▶</button>
      </div>

      <div class="actions">
        <button class="btn btn-album" onclick="document.getElementById('album-input').click()">🖼️ 사진 변경</button>
        <button class="btn btn-warp" onclick="applyCrop()">✅ 영역 자르기 완료</button>
      </div>
    </div>
  </div>

  <!-- 하단 컨트롤 패널 2: 필터 및 출력 -->
  <div id="action-panel" class="bottom-panel">
    <div class="slider-group">
      <div class="slider-row">
        <span class="label">밝기</span>
        <input type="range" id="val-brightness" min="50" max="150" value="100" oninput="renderFilteredPreview()">
        <span class="val-text" id="txt-brightness">100%</span>
      </div>
      <div class="slider-row">
        <span class="label">대비</span>
        <input type="range" id="val-contrast" min="50" max="200" value="100" oninput="renderFilteredPreview()">
        <span class="val-text" id="txt-contrast">100%</span>
      </div>
      <div class="slider-row">
        <span class="label">흑백</span>
        <input type="range" id="val-grayscale" min="0" max="100" value="0" oninput="renderFilteredPreview()">
        <span class="val-text" id="txt-grayscale">0%</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-album" style="flex: 1;" onclick="backToCrop()">◀ 뒤로</button>
      <button class="btn btn-print" style="flex: 1;" onclick="printA4()">🖨️ 실물크기</button>
      <button class="btn btn-warp" style="flex: 1.3;" onclick="saveA4Document()">💾 A4 저장</button>
    </div>
  </div>

  <div id="print-area"><img id="print-img" alt="신분증 인쇄"></div>

  <script>
    let cvReady = false;
    let originalImg = null, points = [], activeIdx = 0, scaleX = 1, scaleY = 1;
    let stepSize = 0.5;
    let nudgeTimer = null, nudgeInterval = null;
    let renderRequested = false;
    let flatImageCanvas = null; // 잘라낸 원본 캔버스 저장용

    const cornerNames = ["좌상단 ┌", "우상단 ┐", "우하단 ┘", "좌하단 └"];

    function onOpenCvReady() { 
      cvReady = true; 
      document.getElementById('status-badge').innerHTML = "🔒 보안 처리 (준비완료)";
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    function toggleStep() {
      const btn = document.getElementById('step-btn');
      if (stepSize === 0.5) {
        stepSize = 2.0; btn.innerText = "2.0px"; btn.style.background = "#2979ff"; btn.style.color = "#fff";
      } else {
        stepSize = 0.5; btn.innerText = "0.5px"; btn.style.background = "#ff9800"; btn.style.color = "#000";
      }
      requestSafeRender();
    }

    // 1. 이미지 로드 및 초기화
    document.getElementById('album-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const tempImg = new Image();
        tempImg.onload = () => {
          originalImg = tempImg;
          openEditorView();
        };
        tempImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    };

    function openEditorView() {
      document.getElementById('upload-view').style.display = 'none';
      document.getElementById('preview-view').style.display = 'none';
      document.getElementById('action-panel').style.display = 'none';
      
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('crop-panel').style.display = 'flex';

      const container = document.getElementById('main-container');
      const scale = Math.min(container.clientWidth / originalImg.width, container.clientHeight / originalImg.height);
      const canvas = document.getElementById('editor-canvas');
      canvas.width = Math.round(originalImg.width * scale);
      canvas.height = Math.round(originalImg.height * scale);
      scaleX = originalImg.width / canvas.width;
      scaleY = originalImg.height / canvas.height;

      const w = canvas.width, h = canvas.height;
      const cardW = Math.min(w * 0.80, h * 0.80 * 1.586);
      const cardH = cardW / 1.586;
      const sx = (w - cardW) / 2;
      const sy = (h - cardH) / 2;

      points = [
        { x: sx, y: sy },
        { x: sx + cardW, y: sy },
        { x: sx + cardW, y: sy + cardH },
        { x: sx, y: sy + cardH }
      ];

      selectCorner(0);
    }

    function selectCorner(idx) {
      activeIdx = idx;
      const btns = document.querySelectorAll('.corner-btn');
      btns.forEach((b, i) => {
        if (i === idx) b.classList.add('active');
        else b.classList.remove('active');
      });
      requestSafeRender();
    }

    function requestSafeRender() {
      if (!renderRequested) {
        renderRequested = true;
        requestAnimationFrame(() => {
          render();
          renderRequested = false;
        });
      }
    }

    function render() {
      const canvas = document.getElementById('editor-canvas');
      if (!canvas || !originalImg) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 230, 118, 0.18)'; ctx.fill();
      ctx.strokeStyle = '#00e676'; ctx.lineWidth = 2.5; ctx.stroke();

      points.forEach((p, i) => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = (activeIdx === i) ? '#ffea00' : '#ff1744'; ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
      });

      updateLoupe();
    }

    function updateLoupe() {
      const loupe = document.getElementById('loupe-container');
      const lCanvas = document.getElementById('loupe-canvas');
      const lCtx = lCanvas.getContext('2d');
      const canvas = document.getElementById('editor-canvas');
      document.getElementById('loupe-label').innerText = `${cornerNames[activeIdx]} (${stepSize}px)`;
      loupe.style.display = 'block';

      const p = points[activeIdx];
      if (p.y > canvas.height * 0.45 && p.x > canvas.width * 0.45) {
        loupe.style.top = '12px'; loupe.style.bottom = 'auto'; loupe.style.right = '12px';
      } else {
        loupe.style.bottom = '12px'; loupe.style.top = 'auto'; loupe.style.right = '12px';
      }

      const cx = 70, cy = 70, viewSize = 35;
      const cropW = viewSize * scaleX, cropH = viewSize * scaleY;
      const cropX = (p.x * scaleX) - (cropW / 2), cropY = (p.y * scaleY) - (cropH / 2);

      lCtx.fillStyle = '#181818'; lCtx.fillRect(0, 0, 140, 140);
      try { lCtx.drawImage(originalImg, cropX, cropY, cropW, cropH, 0, 0, 140, 140); } catch(e){}

      lCtx.save();
      lCtx.lineWidth = 3; lCtx.strokeStyle = '#ff1744'; lCtx.beginPath();
      const arm = 35;
      if (activeIdx === 0) { lCtx.moveTo(cx + arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy + arm); }
      else if (activeIdx === 1) { lCtx.moveTo(cx - arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy + arm); }
      else if (activeIdx === 2) { lCtx.moveTo(cx - arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy - arm); }
      else if (activeIdx === 3) { lCtx.moveTo(cx + arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy - arm); }
      lCtx.stroke();
      lCtx.fillStyle = '#ffea00'; lCtx.beginPath(); lCtx.arc(cx, cy, 2.5, 0, Math.PI * 2); lCtx.fill();
      lCtx.restore();
    }

    // 터치 & D-Pad 로직
    function applyNudge(dirX, dirY) {
      if (activeIdx === -1) return;
      const canvas = document.getElementById('editor-canvas');
      points[activeIdx].x = Math.max(0, Math.min(canvas.width, points[activeIdx].x + (dirX * stepSize)));
      points[activeIdx].y = Math.max(0, Math.min(canvas.height, points[activeIdx].y + (dirY * stepSize)));
      requestSafeRender();
    }

    function bindDpadButton(btnId, dirX, dirY) {
      const btn = document.getElementById(btnId);
      const start = (e) => { e.preventDefault(); stopNudge(); applyNudge(dirX, dirY); nudgeTimer = setTimeout(() => { nudgeInterval = setInterval(() => { applyNudge(dirX, dirY); }, 60); }, 280); };
      btn.addEventListener('pointerdown', start); btn.addEventListener('pointerup', stopNudge);
      btn.addEventListener('pointercancel', stopNudge); btn.addEventListener('pointerleave', stopNudge);
    }
    function stopNudge() { if (nudgeTimer) { clearTimeout(nudgeTimer); nudgeTimer = null; } if (nudgeInterval) { clearInterval(nudgeInterval); nudgeInterval = null; } }

    bindDpadButton('btn-up', 0, -1); bindDpadButton('btn-down', 0, 1); bindDpadButton('btn-left', -1, 0); bindDpadButton('btn-right', 1, 0);

    const canvas = document.getElementById('editor-canvas');
    function getCanvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      const cy = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
      return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
    }
    function handleTouch(e) {
      const pt = getCanvasPoint(e);
      let minDist = Infinity, targetIdx = 0;
      points.forEach((p, i) => { const dist = Math.hypot(p.x - pt.x, p.y - pt.y); if (dist < minDist) { minDist = dist; targetIdx = i; } });
      selectCorner(targetIdx);
    }
    function handleDrag(e) {
      if (activeIdx === -1) return; e.preventDefault();
      const pt = getCanvasPoint(e);
      points[activeIdx].x = Math.max(0, Math.min(canvas.width, pt.x));
      points[activeIdx].y = Math.max(0, Math.min(canvas.height, pt.y));
      requestSafeRender();
    }
    canvas.addEventListener('mousedown', handleTouch); canvas.addEventListener('touchstart', handleTouch, {passive: false});
    canvas.addEventListener('mousemove', handleDrag); canvas.addEventListener('touchmove', handleDrag, {passive: false});


    // =========================================================================
    // 신규 통합 로직: OpenCV 처리 후 필터 미리보기 창 띄우기
    // =========================================================================

    function getCleanCardCanvas() {
      const dstW = 1011, dstH = 638;
      const rawCanvas = document.createElement('canvas'); rawCanvas.width = dstW; rawCanvas.height = dstH;
      const srcMat = cv.imread(originalImg);
      const dstMat = new cv.Mat();
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, points.flatMap(p => [p.x * scaleX, p.y * scaleY]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dstW, 0, dstW, dstH, 0, dstH]);
      
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      cv.warpPerspective(srcMat, dstMat, M, new cv.Size(dstW, dstH), cv.INTER_CUBIC);
      
      // 사용자 기존 선명도(언샤프 마스크) 로직
      const blurred = new cv.Mat();
      cv.GaussianBlur(dstMat, blurred, new cv.Size(0, 0), 2.0);
      cv.addWeighted(dstMat, 1.35, blurred, -0.35, 0, dstMat);
      blurred.delete();
      
      cv.imshow(rawCanvas, dstMat);
      srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();
      
      // 모서리 둥글게 처리
      const outCanvas = document.createElement('canvas'); outCanvas.width = dstW; outCanvas.height = dstH;
      const oCtx = outCanvas.getContext('2d');
      oCtx.fillStyle = '#ffffff'; oCtx.fillRect(0, 0, dstW, dstH);
      oCtx.save(); oCtx.beginPath(); oCtx.roundRect(0, 0, dstW, dstH, 36); oCtx.clip();
      oCtx.drawImage(rawCanvas, 0, 0); oCtx.restore();
      
      return outCanvas;
    }

    // 자르기 완료 -> 필터 뷰로 이동
    function applyCrop() {
      if (typeof cv === 'undefined' || !cvReady) { showToast('이미지 처리 엔진을 불러오는 중입니다...'); return; }
      
      showToast("이미지 펴는 중...");
      setTimeout(() => {
        flatImageCanvas = getCleanCardCanvas(); // 고해상도 원본 임시 저장
        
        // 뷰 전환
        document.getElementById('editor-view').style.display = 'none';
        document.getElementById('crop-panel').style.display = 'none';
        
        document.getElementById('preview-view').style.display = 'flex';
        document.getElementById('action-panel').style.display = 'flex';
        
        // 슬라이더 초기화
        document.getElementById('val-brightness').value = 100;
        document.getElementById('val-contrast').value = 100;
        document.getElementById('val-grayscale').value = 0;
        
        renderFilteredPreview();
      }, 100);
    }

    // 다시 자르기로 돌아가기
    function backToCrop() {
      document.getElementById('preview-view').style.display = 'none';
      document.getElementById('action-panel').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('crop-panel').style.display = 'flex';
    }

    // 필터 슬라이더 값 적용
    function renderFilteredPreview() {
      if (!flatImageCanvas) return;
      
      const pCanvas = document.getElementById('preview-canvas');
      const pCtx = pCanvas.getContext('2d');
      
      pCanvas.width = flatImageCanvas.width;
      pCanvas.height = flatImageCanvas.height;

      const b = document.getElementById('val-brightness').value;
      const c = document.getElementById('val-contrast').value;
      const g = document.getElementById('val-grayscale').value;

      document.getElementById('txt-brightness').innerText = b + '%';
      document.getElementById('txt-contrast').innerText = c + '%';
      document.getElementById('txt-grayscale').innerText = g + '%';

      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      pCtx.filter = `brightness(${b}%) contrast(${c}%) grayscale(${g}%)`;
      pCtx.drawImage(flatImageCanvas, 0, 0);
    }

    // =========================================================================
    // 내보내기 로직 (인쇄 & 저장) -> 적용된 필터(preview-canvas) 기준 출력
    // =========================================================================

    function printA4() {
      const pCanvas = document.getElementById('preview-canvas');
      document.getElementById('print-img').src = pCanvas.toDataURL('image/jpeg', 1.0);
      window.print();
    }

    async function saveA4Document() {
      const pCanvas = document.getElementById('preview-canvas');
      
      // A4 사이즈 배경 생성 (휴대폰 개통 서류 규격 대응)
      const a4 = document.createElement('canvas'); 
      a4.width = 2480; a4.height = 3508;
      const ctx = a4.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,2480,3508);
      
      // 중앙 상단부에 배치 (비율 그대로 삽입)
      ctx.drawImage(pCanvas, (2480 - 1011) / 2, 380, 1011, 638);
      
      const link = document.createElement('a'); 
      link.download = "신분증_A4스캔본.jpg"; 
      link.href = a4.toDataURL("image/jpeg", 1.0); 
      link.click();
      
      showToast("A4 포맷 저장 완료!");
    }
  </script>
</body>
</html>

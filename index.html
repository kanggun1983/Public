<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 스마트 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    #main-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #121212; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* 모서리 맞춤 확대경 */
    #loupe-container { 
      position: absolute; 
      bottom: 130px; 
      right: 12px; 
      width: 140px; 
      height: 140px; 
      border: 2.5px solid #00e676; 
      border-radius: 10px;
      background: #1e1e1e; 
      z-index: 50; 
      display: none; 
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.85);
      overflow: hidden;
    }
    #loupe-canvas { width: 100%; height: 100%; }
    #loupe-label {
      position: absolute;
      top: 5px;
      left: 6px;
      font-size: 11px;
      font-weight: bold;
      color: #00e676;
      background: rgba(0,0,0,0.75);
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 10;
    }

    /* 하단 조작 패널 */
    #control-panel { height: 120px; background: #1e1e1e; display: flex; align-items: center; justify-content: space-around; padding: 10px; border-top: 1px solid #333; }
    .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; gap: 4px; }
    .dpad button { background: #333; color: white; border: 1px solid #555; border-radius: 8px; font-size: 18px; font-weight: bold; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .actions { display: flex; flex-direction: column; gap: 6px; width: 140px; }
    .btn-row { display: flex; gap: 5px; width: 100%; }
    .btn { height: 42px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-camera { background: #2979ff; color: white; }
    .btn-album { background: #455a64; color: white; }
    .btn-warp { background: #00e676; color: black; font-size: 16px; font-weight: bold; }
    .btn-print { background: #9c27b0; color: white; }
    
    #result-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:200; }
    #result-canvas { max-width: 95vw; max-height: 65vh; object-fit: contain; border: 2px solid #fff; border-radius: 6px; }

    /* A4 실제 규격(85.6mm x 53.98mm) 1:1 출력 전용 */
    #print-area { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      body { background: #fff !important; }
      body > * { display: none !important; }
      #print-area {
        display: block !important;
        position: absolute;
        left: 20mm;
        top: 20mm;
        width: 85.6mm;
        height: 53.98mm;
      }
      #print-area img {
        width: 85.6mm;
        height: 53.98mm;
        display: block;
        object-fit: fill;
      }
    }
  </style>
</head>
<body>

  <div id="main-container">
    <canvas id="editor-canvas"></canvas>
    <div id="loupe-container">
      <span id="loupe-label">모서리</span>
      <canvas id="loupe-canvas" width="140" height="140"></canvas>
    </div>
  </div>

  <div id="control-panel">
    <div class="dpad">
      <div></div><button onclick="nudge(0,-2)">▲</button><div></div>
      <button onclick="nudge(-2,0)">◀</button><button onclick="nudge(0,2)">▼</button><button onclick="nudge(2,0)">▶</button>
    </div>
    <div class="actions">
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
      <input type="file" id="album-input" accept="image/*" style="display: none;">
      
      <div class="btn-row">
        <button class="btn btn-camera" style="flex: 1;" onclick="document.getElementById('camera-input').click()">📷 촬영</button>
        <button class="btn btn-album" style="flex: 1;" onclick="document.getElementById('album-input').click()">🖼️ 앨범</button>
      </div>
      <button class="btn btn-warp" id="btn-scan" onclick="processScan()">완료</button>
    </div>
  </div>

  <div id="result-modal">
    <canvas id="result-canvas"></canvas>
    <div style="display: flex; gap: 8px; margin-top: 18px; width: 92%; max-width: 400px;">
      <button class="btn btn-camera" style="flex: 1;" onclick="document.getElementById('result-modal').style.display='none'">다시 수정</button>
      <button class="btn btn-print" style="flex: 1.2;" onclick="printA4()">🖨️ A4 인쇄</button>
      <button class="btn btn-warp" style="flex: 1;" onclick="downloadResult()">저장(JPG)</button>
    </div>
  </div>

  <div id="print-area"><img id="print-img" alt="신분증 인쇄"></div>

  <script>
    let cvReady = false, originalImg = null, points = [], activeIdx = -1, scaleX = 1, scaleY = 1;
    const cornerNames = ["좌상단 ┌", "우상단 ┐", "우하단 ┘", "좌하단 └"];

    function onOpenCvReady() { cvReady = true; }

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        originalImg = new Image();
        originalImg.onload = () => {
          const container = document.getElementById('main-container');
          const scale = Math.min(container.clientWidth / originalImg.width, container.clientHeight / originalImg.height);
          const canvas = document.getElementById('editor-canvas');
          canvas.width = originalImg.width * scale;
          canvas.height = originalImg.height * scale;
          scaleX = originalImg.width / canvas.width;
          scaleY = originalImg.height / canvas.height;
          
          autoDetectSmart();
        };
        originalImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('camera-input').onchange = (e) => handleFile(e.target.files[0]);
    document.getElementById('album-input').onchange = (e) => handleFile(e.target.files[0]);

    // 신분증 비율(85.6 : 54) 기준 자동 감지 및 스마트 기본값 설정
    function autoDetectSmart() {
      let detected = false;
      if (cvReady) {
        try {
          const procW = 600;
          const procH = Math.round((originalImg.height / originalImg.width) * procW);
          const procCanvas = document.createElement('canvas');
          procCanvas.width = procW;
          procCanvas.height = procH;
          const pCtx = procCanvas.getContext('2d');
          pCtx.drawImage(originalImg, 0, 0, procW, procH);

          const src = cv.imread(procCanvas);
          const gray = new cv.Mat(), blurred = new cv.Mat(), thresh = new cv.Mat();

          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          cv.GaussianBlur(gray, blurred, new cv.Size(7, 7), 0);
          cv.adaptiveThreshold(blurred, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);

          const contours = new cv.MatVector(), hierarchy = new cv.Mat();
          cv.findContours(thresh, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

          let bestPts = null;
          const totalArea = procW * procH;

          for (let i = 0; i < contours.size(); ++i) {
            const cnt = contours.get(i);
            const area = cv.contourArea(cnt);
            if (area > totalArea * 0.15 && area < totalArea * 0.85) {
              const rot = cv.minAreaRect(cnt);
              const aspect = Math.max(rot.size.width, rot.size.height) / Math.min(rot.size.width, rot.size.height);
              // 신분증 비율 (1.3 ~ 1.8 사이 사각형 우선 포착)
              if (aspect >= 1.25 && aspect <= 1.85) {
                const vertices = cv.RotatedRect.points(rot);
                bestPts = vertices.map(v => ({ x: v.x, y: v.y }));
                break;
              }
            }
          }

          src.delete(); gray.delete(); blurred.delete(); thresh.delete(); contours.delete(); hierarchy.delete();

          if (bestPts && bestPts.length === 4) {
            const rX = editorCanvas.width / procW;
            const rY = editorCanvas.height / procH;
            points = orderPoints(bestPts.map(p => ({
              x: Math.max(0, Math.min(editorCanvas.width, p.x * rX)),
              y: Math.max(0, Math.min(editorCanvas.height, p.y * rY))
            })));
            detected = true;
          }
        } catch (e) {
          detected = false;
        }
      }

      if (!detected) {
        setDefaultCardPoints();
      }

      activeIdx = 0; // 좌상단 기본 선택
      render();
    }

    // 신분증 실제 규격(1.586 : 1)으로 화면 중앙에 알맞게 기본 배치
    function setDefaultCardPoints() {
      const w = editorCanvas.width;
      const h = editorCanvas.height;
      const cardW = Math.min(w * 0.75, h * 0.75 * 1.586);
      const cardH = cardW / 1.586;
      const startX = (w - cardW) / 2;
      const startY = (h - cardH) / 2;

      points = [
        { x: startX, y: startY },                 // 좌상단
        { x: startX + cardW, y: startY },         // 우상단
        { x: startX + cardW, y: startY + cardH }, // 우하단
        { x: startX, y: startY + cardH }          // 좌하단
      ];
    }

    function orderPoints(pts) {
      const sum = pts.map(p => p.x + p.y);
      const diff = pts.map(p => p.y - p.x);
      return [
        pts[sum.indexOf(Math.min(...sum))],
        pts[diff.indexOf(Math.min(...diff))],
        pts[sum.indexOf(Math.max(...sum))],
        pts[diff.indexOf(Math.max(...diff))]
      ];
    }

    function render() {
      const canvas = document.getElementById('editor-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 230, 118, 0.18)';
      ctx.fill();
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 3;
      ctx.stroke();

      points.forEach((p, i) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
        ctx.fillStyle = (activeIdx === i) ? '#ffea00' : '#ff1744';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();
      });

      if (activeIdx !== -1) updateLoupe();
      else document.getElementById('loupe-container').style.display = 'none';
    }

    // 돋보기 고화질 스케일 버그 수정 (선명한 2.5배 확대)
    function updateLoupe() {
      const loupe = document.getElementById('loupe-container');
      const lCanvas = document.getElementById('loupe-canvas');
      const lCtx = lCanvas.getContext('2d');
      document.getElementById('loupe-label').innerText = cornerNames[activeIdx];
      loupe.style.display = 'block';

      const p = points[activeIdx];
      const cx = 70, cy = 70;

      // 화면 기준 56px 범위를 140px로 2.5배 확대
      const viewSize = 56;
      const cropW = viewSize * scaleX;
      const cropH = viewSize * scaleY;
      const cropX = (p.x * scaleX) - (cropW / 2);
      const cropY = (p.y * scaleY) - (cropH / 2);

      lCtx.fillStyle = '#1e1e1e';
      lCtx.fillRect(0, 0, 140, 140);
      lCtx.drawImage(originalImg, cropX, cropY, cropW, cropH, 0, 0, 140, 140);

      lCtx.save();
      lCtx.lineWidth = 3.5;
      lCtx.strokeStyle = '#ff1744';
      lCtx.shadowColor = '#000';
      lCtx.shadowBlur = 4;
      lCtx.beginPath();

      const arm = 32;
      if (activeIdx === 0) {
        lCtx.moveTo(cx + arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy + arm);
      } else if (activeIdx === 1) {
        lCtx.moveTo(cx - arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy + arm);
      } else if (activeIdx === 2) {
        lCtx.moveTo(cx - arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy - arm);
      } else if (activeIdx === 3) {
        lCtx.moveTo(cx + arm, cy); lCtx.lineTo(cx, cy); lCtx.lineTo(cx, cy - arm);
      }
      lCtx.stroke();

      lCtx.fillStyle = '#ffea00';
      lCtx.beginPath();
      lCtx.arc(cx, cy, 3.5, 0, Math.PI * 2);
      lCtx.fill();
      lCtx.restore();
    }

    function nudge(dx, dy) {
      if (activeIdx === -1) return;
      points[activeIdx].x = Math.max(0, Math.min(editorCanvas.width, points[activeIdx].x + dx));
      points[activeIdx].y = Math.max(0, Math.min(editorCanvas.height, points[activeIdx].y + dy));
      render();
    }

    const handleTouch = (e) => {
      const rect = editorCanvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      const found = points.findIndex(p => Math.hypot(p.x - x, p.y - y) < 45);
      if (found !== -1) {
        activeIdx = found;
        render();
      }
    };

    const handleDrag = (e) => {
      if (activeIdx === -1) return;
      e.preventDefault();
      const rect = editorCanvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      points[activeIdx].x = Math.max(0, Math.min(editorCanvas.width, x));
      points[activeIdx].y = Math.max(0, Math.min(editorCanvas.height, y));
      render();
    };

    const canvas = document.getElementById('editor-canvas');
    canvas.addEventListener('mousedown', handleTouch);
    canvas.addEventListener('touchstart', handleTouch);
    canvas.addEventListener('mousemove', handleDrag);
    canvas.addEventListener('touchmove', handleDrag, {passive:false});

    function processScan() {
      if (!cvReady || !originalImg) return;
      const dstW = 1011, dstH = 638; // 300 DPI 규격 (85.6mm : 53.98mm)
      const srcMat = cv.imread(originalImg);
      const dstMat = new cv.Mat();
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, points.flatMap(p => [p.x * scaleX, p.y * scaleY]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dstW, 0, dstW, dstH, 0, dstH]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      cv.warpPerspective(srcMat, dstMat, M, new cv.Size(dstW, dstH), cv.INTER_LINEAR);
      
      const rCanvas = document.getElementById('result-canvas');
      rCanvas.width = dstW;
      rCanvas.height = dstH;
      cv.imshow(rCanvas, dstMat);
      
      document.getElementById('result-modal').style.display = 'flex';
      srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();
    }

    function downloadResult() {
      const link = document.createElement('a');
      link.download = `ID_SCAN_300DPI_${Date.now()}.jpg`;
      link.href = document.getElementById('result-canvas').toDataURL('image/jpeg', 0.95);
      link.click();
    }

    function printA4() {
      const dataUrl = document.getElementById('result-canvas').toDataURL('image/jpeg', 1.0);
      const pImg = document.getElementById('print-img');
      pImg.src = dataUrl;
      pImg.onload = () => {
        window.print();
      };
    }
  </script>
</body>
</html>

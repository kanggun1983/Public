<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 정밀 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { font-family: sans-serif; background: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { height: 44px; background: #111; display: flex; align-items: center; justify-content: center; font-weight: bold; border-bottom: 1px solid #333; }
    #main-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    #upload-view { width: 80%; height: 200px; border: 2px dashed #666; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; cursor: pointer; background: #1a1a1a; border-radius: 20px; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    /* 확대경 */
    #loupe { position: absolute; width: 140px; height: 140px; border: 3px solid #00e676; border-radius: 12px; background: #000; z-index: 50; display: none; pointer-events: none; overflow: hidden; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    
    #control-panel { background: #181818; padding: 10px; border-top: 1px solid #333; display: none; flex-direction: column; gap: 8px; }
    .corner-btn { flex: 1; height: 35px; background: #333; border: 1px solid #555; color: #fff; border-radius: 5px; font-size: 12px; }
    .corner-btn.active { background: #00e676; color: #000; font-weight: bold; }
    
    .dpad-row { display: flex; align-items: center; gap: 10px; }
    .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; gap: 5px; }
    .dpad button { background: #444; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .actions { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .btn { height: 45px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
<header>신분증 정밀 스캐너</header>
<input type="file" id="album-input" accept="image/*" style="display: none;">

<div id="main-container">
    <div id="upload-view" onclick="document.getElementById('album-input').click()">🖼️ 갤러리에서 사진 선택</div>
    <canvas id="editor-canvas"></canvas>
    <div id="loupe"><canvas id="loupe-canvas" width="140" height="140"></canvas></div>
</div>

<div id="control-panel">
    <div style="display: flex; gap: 5px;">
        <button class="corner-btn active" onclick="selectCorner(0)">┌ 좌상</button>
        <button class="corner-btn" onclick="selectCorner(1)">┐ 우상</button>
        <button class="corner-btn" onclick="selectCorner(2)">┘ 우하</button>
        <button class="corner-btn" onclick="selectCorner(3)">└ 좌하</button>
        <button id="step-btn" onclick="toggleStep()" style="width:60px; background:#ff9800; border:none; border-radius:5px;">0.5px</button>
    </div>
    <div class="dpad-row">
        <div class="dpad">
            <div></div><button onpointerdown="startNudge(0,-1)" onpointerup="stopNudge()">▲</button><div></div>
            <button onpointerdown="startNudge(-1,0)" onpointerup="stopNudge()">◀</button>
            <button onpointerdown="startNudge(0,1)" onpointerup="stopNudge()">▼</button>
            <button onpointerdown="startNudge(1,0)" onpointerup="stopNudge()">▶</button>
        </div>
        <div class="actions">
            <button class="btn" style="background:#9c27b0; color:#fff;" onclick="printCard()">🖨️ 실물크기 인쇄</button>
            <button class="btn" style="background:#00e676; color:#000;" onclick="saveResult()">💾 저장(JPG)</button>
        </div>
    </div>
</div>

<script>
    let cvReady = false, originalImg = null, points = [], activeIdx = 0, stepSize = 0.5, nudgeInterval = null;
    function onOpenCvReady() { cvReady = true; }

    document.getElementById('album-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            originalImg = new Image();
            originalImg.onload = () => {
                document.getElementById('upload-view').style.display = 'none';
                document.getElementById('control-panel').style.display = 'flex';
                initCanvas();
            };
            originalImg.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    function initCanvas() {
        const canvas = document.getElementById('editor-canvas');
        const scale = Math.min(window.innerWidth/originalImg.width, (window.innerHeight*0.5)/originalImg.height);
        canvas.width = originalImg.width * scale; canvas.height = originalImg.height * scale;
        const s = canvas.width*0.1;
        points = [{x:s,y:s}, {x:canvas.width-s, y:s}, {x:canvas.width-s, y:canvas.height-s}, {x:s, y:canvas.height-s}];
        render();
    }

    function render() {
        const canvas = document.getElementById('editor-canvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#00e676'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
        points.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath(); ctx.stroke();
        points.forEach((p, i) => {
            ctx.fillStyle = (i === activeIdx) ? '#ffea00' : '#ff1744';
            ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
        });
        updateLoupe();
    }

    function selectCorner(idx) { activeIdx = idx; document.querySelectorAll('.corner-btn').forEach((b,i)=>b.className='corner-btn'+(i===idx?' active':'')); render(); }
    function toggleStep() { stepSize = (stepSize === 0.5) ? 2.0 : 0.5; document.getElementById('step-btn').innerText = stepSize + "px"; }
    function startNudge(dx, dy) {
        clearInterval(nudgeInterval);
        nudgeInterval = setInterval(() => { points[activeIdx].x += dx * stepSize; points[activeIdx].y += dy * stepSize; render(); }, 50);
    }
    function stopNudge() { clearInterval(nudgeInterval); }

    function updateLoupe() {
        const loupe = document.getElementById('loupe');
        const lCtx = document.getElementById('loupe-canvas').getContext('2d');
        const p = points[activeIdx];
        const scaleW = originalImg.width / document.getElementById('editor-canvas').width;
        const scaleH = originalImg.height / document.getElementById('editor-canvas').height;
        lCtx.drawImage(originalImg, p.x * scaleW - 50, p.y * scaleH - 50, 100, 100, 0, 0, 140, 140);
        loupe.style.display = 'block';
    }

    const canvas = document.getElementById('editor-canvas');
    canvas.addEventListener('pointermove', (e) => {
        if(e.buttons !== 1) return;
        const rect = canvas.getBoundingClientRect();
        points[activeIdx] = { x: (e.clientX - rect.left)*(canvas.width/rect.width), y: (e.clientY - rect.top)*(canvas.height/rect.height) };
        render();
    });

    function getCleanCard() {
        const dstW = 1011, dstH = 638;
        const canvas = document.createElement('canvas'); canvas.width = dstW; canvas.height = dstH;
        const ctx = canvas.getContext('2d');
        // Perspective Warp(간소화)
        ctx.drawImage(originalImg, 0, 0, dstW, dstH);
        const out = document.createElement('canvas'); out.width = dstW; out.height = dstH;
        const oCtx = out.getContext('2d');
        oCtx.fillStyle = '#fff'; oCtx.fillRect(0,0,dstW,dstH);
        oCtx.beginPath(); oCtx.roundRect(0,0,dstW,dstH, 36); oCtx.clip();
        oCtx.drawImage(canvas, 0, 0);
        return out;
    }

    function saveResult() {
        const a4 = document.createElement('canvas'); a4.width=2480; a4.height=3508;
        const ctx = a4.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,2480,3508);
        ctx.drawImage(getCleanCard(), (2480-1011)/2, 380, 1011, 638);
        const link = document.createElement('a'); link.download = "신분증_A4.jpg"; link.href = a4.toDataURL("image/jpeg", 1.0); link.click();
    }

    function printCard() {
        const card = getCleanCard();
        const win = window.open();
        win.document.write(`<img src="${card.toDataURL()}" style="width:85.6mm; height:53.98mm;">`);
        setTimeout(() => { win.print(); win.close(); }, 500);
    }
</script>
</body>
</html>

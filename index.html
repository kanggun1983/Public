<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>고화질 신분증 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    /* ... 이전 스타일 유지 ... */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: sans-serif; background: #0d0d0d; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* ... (생략: 기존 스타일 그대로 유지) ... */
    header { height: 44px; background: #181818; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2c2c2c; }
    #main-container { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; position: absolute; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    #control-panel { background: #181818; padding: 10px; border-top: 1px solid #2c2c2c; }
    .btn { height: 44px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-print { background: #9c27b0; color: white; flex:1; }
    .btn-warp { background: #00e676; color: black; flex:1.5; }

    /* 핵심: 실물 규격 인쇄 강제 */
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute; left: 0; top: 0; width: 100%;
        display: flex; justify-content: center;
      }
      #print-target {
        width: 85.6mm !important; /* 정확한 신분증 가로 */
        height: 53.98mm !important; /* 정확한 신분증 세로 */
        display: block !important;
      }
    }
  </style>
</head>
<body>
  <!-- ... (생략: HTML 구조는 이전과 동일) ... -->
  <div id="main-container">
    <div id="upload-view" onclick="document.getElementById('album-input').click()">🖼️ 갤러리에서 사진 선택</div>
    <div id="editor-view">
        <canvas id="editor-canvas"></canvas>
    </div>
  </div>
  <div id="control-panel">
     <button class="btn btn-print" onclick="printCard()">🖨️ 실물크기(1:1) 인쇄</button>
  </div>
  <div id="print-area"><img id="print-target"></div>
  
  <script>
    // ... (기존 OpenCV/로직 그대로 유지) ...
    
    // 신분증을 순백색 배경에 실물크기로 처리하는 함수
    function getCleanCardCanvas() {
      const dstW = 1011, dstH = 638; // 300 DPI 규격
      const rawCanvas = document.createElement('canvas');
      rawCanvas.width = dstW; rawCanvas.height = dstH;

      const srcMat = cv.imread(originalImg);
      const dstMat = new cv.Mat();
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, points.flatMap(p => [p.x * scaleX, p.y * scaleY]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dstW, 0, dstW, dstH, 0, dstH]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      cv.warpPerspective(srcMat, dstMat, M, new cv.Size(dstW, dstH), cv.INTER_CUBIC);
      
      // 선명화 필터
      const blurred = new cv.Mat();
      cv.GaussianBlur(dstMat, blurred, new cv.Size(0, 0), 2.0);
      cv.addWeighted(dstMat, 1.35, blurred, -0.35, 0, dstMat);
      blurred.delete();

      cv.imshow(rawCanvas, dstMat);
      srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();

      // 배경을 순백색으로 채우고 모서리 마스킹
      const outCanvas = document.createElement('canvas');
      outCanvas.width = dstW; outCanvas.height = dstH;
      const oCtx = outCanvas.getContext('2d');
      oCtx.fillStyle = '#ffffff';
      oCtx.fillRect(0, 0, dstW, dstH);
      oCtx.save();
      oCtx.beginPath();
      oCtx.roundRect(0, 0, dstW, dstH, 36);
      oCtx.clip();
      oCtx.drawImage(rawCanvas, 0, 0);
      oCtx.restore();
      return outCanvas;
    }

    // 1:1 인쇄 실행
    function printCard() {
      if (!cvReady || !originalImg) return;
      const cardCanvas = getCleanCardCanvas();
      const pImg = document.getElementById('print-target');
      pImg.src = cardCanvas.toDataURL('image/jpeg', 1.0);
      window.print();
    }
  </script>
</body>
</html>

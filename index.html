<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신분증 정밀 스캐너</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: sans-serif; background: #0d0d0d; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 44px; background: #181818; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #333; }
    
    #main-container { flex: 1; position: relative; width: 100%; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
    
    /* 갤러리 업로드 */
    #upload-view { width: 80%; height: 50%; border: 2px dashed #555; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; cursor: pointer; }
    
    /* 편집기 */
    #editor-view { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; }
    #editor-canvas { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; }

    /* 컨트롤 패널 */
    #control-panel { background: #181818; padding: 10px; border-top: 1px solid #333; display: none; flex-direction: column; gap: 10px; }
    
    /* 정밀 조정 UI */
    #tools { display: flex; gap: 5px; justify-content: center; }
    .corner-btn { padding: 8px 12px; background: #333; border: 1px solid #555; border-radius: 5px; color: #fff; font-size: 12px; }
    .corner-btn.active { background: #00e676; color: #000; border-color: #00e676; }
    
    #dpad-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 10px; }
    .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; gap: 5px; }
    .dpad button { background: #444; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 20px; }
    .dpad button:active { background: #00e676; color: #000; }
    
    .btn-action { display: flex; gap: 10px; margin-top: 10px; }
    .btn { flex: 1; height: 45px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }

    /* 확대경 */
    #loupe { position: absolute; top: 20px; right: 20px; width: 120px; height: 120px; border: 3px solid #00e676; border-radius: 10px; overflow: hidden; display: none; pointer-events: none; }
  </style>
</head>
<body>

<header><h1>신분증 정밀 스캐너</h1></header>

<input type="file" id="album-input" accept="image/*" style="display: none;">

<div id="main-container">
    <div id="upload-view" onclick="document.getElementById('album-input').click()">
        <div style="font-size: 40px;">🖼️</div>
        <div>갤러리에서 사진 불러오기</div>
    </div>
    
    <div id="editor-view">
        <canvas id="editor-canvas"></canvas>
        <div id="loupe"><canvas id="loupe-canvas" width="120" height="120"></canvas></div>
    </div>
</div>

<div id="control-panel">
    <div id="tools">
        <button class="corner-btn active" onclick="selectCorner(0)">┌ 좌상</button>
        <button class="corner-btn" onclick="selectCorner(1)">┐ 우상</button>
        <button class="corner-btn" onclick="selectCorner(2)">┘ 우하</button>
        <button class="corner-btn" onclick="selectCorner(3)">└ 좌하</button>
        <button id="step-btn" onclick="toggleStep()" style="background:#ff9800; border:none; border-radius:5px; padding:0 10px; font-weight:bold;">0.5px</button>
    </div>
    
    <div id="dpad-container">
        <div class="dpad">
            <div></div><button onpointerdown="startNudge(0,-1)" onpointerup="stopNudge()">▲</button><div></div>
            <button onpointerdown="startNudge(-1,0)" onpointerup="stopNudge()">◀</button>
            <button onpointerdown="startNudge(0,1)" onpointerup="stopNudge()">▼</button>
            <button onpointerdown="startNudge(1,0)" onpointerup="stopNudge()">▶</button>
        </div>
        <div class="actions" style="flex:1;">
            <div class="btn-action">
                <button class="btn" style="background:#555;" onclick="location.reload()">새로고침</button>
                <button class="btn" style="background:#9c27b0;" onclick="printCard()">🖨️ 인쇄</button>
                <button class="btn" style="background:#00e676;" onclick="saveResult()">💾 저장</button>
            </div>
        </div>
    </div>
</div>

<script>
    let cvReady = false, originalImg = null, points = [], activeIdx = 0, stepSize = 0.5, nudgeInterval = null;
    function onOpenCvReady() { cvReady = true; }

    document.getElementById('album-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            originalImg = new Image();
            originalImg.onload = () => {
                document.getElementById('upload-view').style.display = 'none';
                document.getElementById('editor-view').style.display = 'flex';
                document.getElementById('control-panel').style.display = 'flex';
                initCanvas();
            };
            originalImg.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    function initCanvas() {
        const canvas = document.getElementById('editor-canvas');
        const scale = Math.min(window.innerWidth/originalImg.width, (window.innerHeight*0.6)/originalImg.height);
        canvas.width = originalImg.width * scale; canvas.height = originalImg.height * scale;
        const sx = canvas.width*0.1, sy = canvas.height*0.1;
        points = [{x:sx, y:sy}, {x:canvas.width-sx, y:sy}, {x:canvas.width-sx, y:canvas.height-sy}, {x:sx, y:canvas.height-sy}];
        render();
    }

    function render() {
        const ctx = document.getElementById('editor-canvas').getContext('2d');
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.drawImage(originalImg, 0, 0, ctx.canvas.width, ctx.canvas.height);
        // Draw polygon
        ctx.strokeStyle = '#00e676'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
        points.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath(); ctx.stroke();
        // Draw handles
        points.forEach((p, i) => {
            ctx.fillStyle = (i === activeIdx) ? '#ffea00' : '#ff1744';
            ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI*2); ctx.fill();
        });
        updateLoupe();
    }

    function selectCorner(idx) { activeIdx = idx; render(); }
    function toggleStep() { stepSize = (stepSize === 0.5) ? 2.0 : 0.5; document.getElementById('step-btn').innerText = stepSize + "px"; }
    
    function startNudge(dx, dy) {
        stopNudge();
        nudgeInterval = setInterval(() => {
            points[activeIdx].x += dx * stepSize; points[activeIdx].y += dy * stepSize;
            render();
        }, 50);
    }
    function stopNudge() { clearInterval(nudgeInterval); }

    function updateLoupe() {
        const lCtx = document.getElementById('loupe-canvas').getContext('2d');
        const p = points[activeIdx];
        lCtx.drawImage(originalImg, (p.x/cvReady?1:1)*5-50, (p.y/cvReady?1:1)*5-50, 100, 100, 0, 0, 120, 120);
        document.getElementById('loupe').style.display = 'block';
    }

    // A4 흰색 배경 마스킹 함수
    function getA4Canvas() {
        const dstW = 1011, dstH = 638;
        const card = document.createElement('canvas'); card.width = dstW; card.height = dstH;
        const ctx = card.getContext('2d');
        // Perspective Warp (OpenCV 생략 시 간소화 로직)
        ctx.drawImage(originalImg, 0, 0, dstW, dstH); 
        
        const a4 = document.createElement('canvas'); a4.width = 2480; a4.height = 3508;
        const a4Ctx = a4.getContext('2d');
        a4Ctx.fillStyle = '#fff'; a4Ctx.fillRect(0,0,2480,3508);
        a4Ctx.drawImage(card, (2480-1011)/2, 350, 1011, 638);
        return a4;
    }

    function saveResult() {
        const a4 = getA4Canvas();
        const link = document.createElement('a');
        link.download = "신분증_스캔본.jpg";
        link.href = a4.toDataURL("image/jpeg", 1.0);
        link.click();
        showToast("저장되었습니다!");
    }

    function printCard() {
        const a4 = getA4Canvas();
        const win = window.open();
        win.document.write(`<img src="${a4.toDataURL()}" style="width:100%">`);
        setTimeout(() => { win.print(); win.close(); }, 500);
    }
</script>
</body>
</html>
